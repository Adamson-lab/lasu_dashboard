<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mind Map | LASU Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsmind@0.5.4/style/jsmind.css">
    <style>
        body { background: #f4f7f6; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; display: flex; }
        
        /* Sidebar */
        .sidebar { width: 300px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; z-index: 10; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #eee; background: #fff; }
        .map-list { flex: 1; overflow-y: auto; padding: 0; }
        
        .map-item { padding: 15px 20px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: 0.2s; position: relative; }
        .map-item:hover { background: #f8f9fa; border-left: 4px solid #6f42c1; }
        .map-item.active { background: #f3e5f5; border-left: 4px solid #6f42c1; }
        .map-title { font-weight: 600; color: #333; }
        .map-date { font-size: 0.75rem; color: #888; }

        /* Main Workspace */
        .workspace { flex: 1; position: relative; display: flex; flex-direction: column; background: #f8f9fa; }
        
        .toolbar { padding: 10px 20px; background: white; border-bottom: 1px solid #ddd; display: flex; gap: 10px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .map-container { flex: 1; position: relative; overflow: auto; }
        #jsmind_container { width: 100%; height: 100%; }
        
        /* Floating Title Input */
        .title-edit { border: none; font-size: 1.2rem; font-weight: bold; color: #333; outline: none; background: transparent; width: 300px; }
        .title-edit::placeholder { color: #ccc; }

        /* Custom Node Styles via CSS */
        jmnode { border-radius: 8px !important; box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-weight: 500; transition: 0.2s; }
        jmnode:hover { transform: scale(1.05); z-index: 100; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold"><i class="fas fa-project-diagram text-purple me-2" style="color: #6f42c1;"></i>Brainstorm</h5>
        <a href="{{ url_for('student_portal') }}" class="btn btn-sm btn-light border"><i class="fas fa-times"></i></a>
    </div>
    
    <div class="p-3 border-bottom">
        <button onclick="createNewMap()" class="btn btn-outline-primary w-100 fw-bold"><i class="fas fa-plus me-2"></i>New Map</button>
    </div>

    <div class="map-list" id="mapList">
        {% for map in maps %}
        <div class="map-item" onclick="loadMap('{{ map.id }}', this)">
            <div class="d-flex justify-content-between">
                <div>
                    <span class="map-title">{{ map.name }}</span>
                    <span class="map-date d-block">{{ map.last_updated.strftime('%d %b, %H:%M') }}</span>
                </div>
                <form action="{{ url_for('delete_mindmap', id=map.id) }}" method="POST" onsubmit="return confirm('Delete this map?');">
                    <button class="btn btn-sm text-danger border-0"><i class="fas fa-trash"></i></button>
                </form>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<div class="workspace">
    <div class="toolbar">
        <input type="text" id="currentMapName" class="title-edit" placeholder="Untitled Map Name..." value="My New Idea">
        <div class="vr mx-2"></div>
        <button class="btn btn-sm btn-light border" onclick="addNode()" title="Add Child Node"><i class="fas fa-plus text-success"></i> Add Node</button>
        <button class="btn btn-sm btn-light border" onclick="deleteNode()" title="Remove Node"><i class="fas fa-minus text-danger"></i> Remove</button>
        <div class="vr mx-2"></div>
        <button class="btn btn-sm btn-light border" onclick="changeTheme('primary')" title="Blue Theme">🔵</button>
        <button class="btn btn-sm btn-light border" onclick="changeTheme('warning')" title="Orange Theme">🟠</button>
        <button class="btn btn-sm btn-light border" onclick="changeTheme('success')" title="Green Theme">🟢</button>
        
        <div class="ms-auto d-flex gap-2">
            <span id="saveStatus" class="text-muted small align-self-center"></span>
            <button class="btn btn-primary btn-sm px-4 fw-bold" onclick="saveCurrentMap()"><i class="fas fa-save me-1"></i> Save</button>
        </div>
    </div>
    
    <div class="map-container">
        <div id="jsmind_container"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsmind@0.5.4/js/jsmind.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsmind@0.5.4/js/jsmind.draggable.js"></script>

<script>
    let jm = null;
    let currentMapId = null;

    const options = {
        container: 'jsmind_container',
        theme: 'primary',
        editable: true,
        support_html: false
    };

    // Initial Data
    const init_data = {
        "meta":{ "name":"demo", "author":"LASU", "version":"0.2" },
        "format":"node_tree",
        "data":{ "id":"root", "topic":"Central Idea", "children":[
            { "id":"sub1", "topic":"Branch 1" },
            { "id":"sub2", "topic":"Branch 2" }
        ]}
    };

    function init() {
        jm = new jsMind(options);
        jm.show(init_data);
    }

    // --- Toolbar Functions ---
    function addNode() {
        const selected_node = jm.get_selected_node();
        if(!selected_node) { alert('Please select a node first!'); return; }
        const nodeid = jsMind.util.uuid.newid();
        const topic = 'New Idea';
        jm.add_node(selected_node, nodeid, topic);
    }

    function deleteNode() {
        const selected_node = jm.get_selected_node();
        if(!selected_node) { alert('Please select a node to delete!'); return; }
        if(selected_node.isroot) { alert('Cannot delete the root node!'); return; }
        jm.remove_node(selected_node);
    }

    function changeTheme(theme) {
        jm.set_theme(theme);
    }

    // --- API Interactions ---
    function saveCurrentMap() {
        const mind_data = jm.get_data('node_tree');
        const mapName = document.getElementById('currentMapName').value;
        const statusSpan = document.getElementById('saveStatus');

        statusSpan.innerText = "Saving...";
        
        fetch('/api/mindmap/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                id: currentMapId,
                name: mapName,
                data: JSON.stringify(mind_data) // Store as string in DB
            })
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                statusSpan.innerText = "Saved!";
                statusSpan.style.color = "green";
                currentMapId = data.id; // Update ID if it was new
                setTimeout(() => { 
                    statusSpan.innerText = "";
                    // Optional: Reload page to update sidebar list, or dynamically prepend
                    if(!document.getElementById(`map-${data.id}`)) location.reload(); 
                }, 1000);
            } else {
                statusSpan.innerText = "Error saving.";
                statusSpan.style.color = "red";
            }
        });
    }

    function loadMap(id, element) {
        // Highlight active item
        document.querySelectorAll('.map-item').forEach(el => el.classList.remove('active'));
        if(element) element.classList.add('active');

        fetch(`/api/mindmap/load/${id}`)
        .then(res => res.json())
        .then(data => {
            if(data.error) { alert(data.error); return; }
            
            currentMapId = data.id;
            document.getElementById('currentMapName').value = data.name;
            const mind_data = JSON.parse(data.data);
            jm.show(mind_data);
        });
    }

    function createNewMap() {
        currentMapId = null;
        document.getElementById('currentMapName').value = "New Brainstorm";
        document.querySelectorAll('.map-item').forEach(el => el.classList.remove('active'));
        jm.show(init_data); // Reset to default
    }

    // Start
    window.onload = init;
</script>

</body>
</html>
