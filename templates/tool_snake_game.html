<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V100000 Apex Ouroboros | L.I.S.A. Utilities</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* ==========================================
           V100000 APEX OUROBOROS THEME ENGINE
           ========================================== */
        
        [data-theme="dark"] {
            --nk-bg: #05080f;
            --nk-surface: #0f1423;
            --nk-text: #e2e8f0;
            --nk-text-muted: #475569;
            --nk-accent: #10b981; /* Emerald Green */
            --nk-accent-glow: rgba(16, 185, 129, 0.4);
            --nk-food: #ef4444; /* Alert Red */
            --nk-golden: #f59e0b; /* Golden Amber */
            --nk-obstacle: #64748b; /* Concrete Gray */
            --nk-border: #1e293b;
            --grid-bg: #03050a;
        }

        [data-theme="light"] {
            --nk-bg: #f1f5f9;
            --nk-surface: #ffffff;
            --nk-text: #0f172a;
            --nk-text-muted: #94a3b8;
            --nk-accent: #059669; 
            --nk-accent-glow: rgba(5, 150, 105, 0.3);
            --nk-food: #dc2626;
            --nk-golden: #d97706;
            --nk-obstacle: #475569;
            --nk-border: #cbd5e1;
            --grid-bg: #e2e8f0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--nk-bg);
            color: var(--nk-text);
            transition: all 0.3s ease;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            touch-action: none;
        }

        .test-container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        /* HUD Header */
        .nk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--nk-border);
        }

        .nk-title {
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            color: var(--nk-accent);
            text-shadow: 0 0 15px var(--nk-accent-glow);
        }

        .btn-nav {
            background: transparent;
            color: var(--nk-text);
            border: 1px solid var(--nk-border);
            padding: 10px 20px;
            font-weight: 900;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            border-radius: 4px;
        }
        .btn-nav:hover { background: var(--nk-surface); border-color: var(--nk-accent); color: var(--nk-accent); }

        /* Telemetry Dashboard */
        .telemetry-dash {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .telemetry-node {
            background: var(--nk-surface);
            border: 1px solid var(--nk-border);
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .node-val {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--nk-text);
            line-height: 1;
            margin-bottom: 5px;
        }

        .node-lbl {
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--nk-text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Layout Structure */
        .main-layout {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            justify-content: center;
        }

        @media (max-width: 900px) {
            .main-layout { flex-direction: column-reverse; align-items: center; }
            .control-panel { width: 100%; max-width: 500px; }
        }

        /* Control Panel */
        .control-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--nk-surface);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--nk-border);
            min-width: 280px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .panel-label {
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--nk-text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .form-select {
            background-color: var(--nk-bg);
            color: var(--nk-text);
            border: 2px solid var(--nk-border);
            padding: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            outline: none;
            width: 100%;
        }
        .form-select:focus { border-color: var(--nk-accent); }

        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .btn-action {
            background: var(--nk-surface);
            color: var(--nk-text);
            border: 2px solid var(--nk-border);
            padding: 15px 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
            flex-grow: 1;
        }
        .btn-action:hover { border-color: var(--nk-text); }
        
        .btn-start {
            background: var(--nk-accent);
            color: #ffffff;
            border: none;
        }
        .btn-start:hover { transform: translateY(-2px); box-shadow: 0 5px 15px var(--nk-accent-glow); border: none; }

        /* The Canvas Arena */
        .arena-box {
            background-color: var(--grid-bg);
            border-radius: 12px;
            padding: 10px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 4px solid var(--nk-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; 
        }

        canvas {
            background-color: var(--nk-surface);
            border-radius: 4px;
            display: block;
            outline: none; 
            z-index: 1;
        }

        /* V100000 Retro CRT Scanline Overlay */
        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.15) 2px,
                rgba(0, 0, 0, 0.15) 4px
            );
            pointer-events: none;
            z-index: 5;
        }

        /* Status Overlay */
        .status-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            display: none;
        }

        .overlay-text {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-align: center;
            color: var(--nk-error);
        }

        .overlay-sub {
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 25px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Tactical Hardware D-Pad */
        .d-pad-container {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px 60px;
            gap: 10px;
            margin-top: 25px;
            justify-content: center;
            z-index: 6; 
        }
        
        .d-pad-btn {
            background: var(--nk-surface);
            border: 2px solid var(--nk-border);
            color: var(--nk-text);
            border-radius: 8px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .d-pad-btn:active {
            transform: scale(0.9);
            background: var(--nk-border);
            border-color: var(--nk-accent);
            color: var(--nk-accent);
        }
        
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

    </style>

    
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
</head>
<body>

    <div class="test-container">
        
        <div class="nk-header">
            <div>
                <h1 class="nk-title">Apex Ouroboros</h1>
                <div style="font-size: 0.8rem; font-weight: bold; color: var(--nk-text-muted); letter-spacing: 3px; margin-top: 5px;">V100000 Synchronized Survival Engine</div>
            </div>
            <div class="d-flex gap-3">
                <button class="btn-nav" onclick="toggleSnakeTheme()"><i class="fas fa-adjust"></i></button>
                <a href="{{ url_for('student_tools_dashboard') }}" class="btn-nav"><i class="fas fa-arrow-left me-2"></i> Dashboard</a>
            </div>
        </div>

        <div class="telemetry-dash">
            <div class="telemetry-node">
                <div class="node-val" id="hudLength" style="color: var(--nk-accent);">1</div>
                <div class="node-lbl">Total Mass</div>
            </div>
            <div class="telemetry-node">
                <div class="node-val" id="hudScore">0</div>
                <div class="node-lbl">Data Absorbed</div>
            </div>
            <div class="telemetry-node">
                <div class="node-val" id="hudHighScore" style="color: var(--nk-text-muted);">0</div>
                <div class="node-lbl">Peak Threshold</div>
            </div>
        </div>

        <div class="main-layout">
            
            <div class="control-panel">
                
                <div>
                    <div class="panel-label">Matrix Boundary Protocol</div>
                    <select id="boundarySelect" class="form-select">
                        <option value="LETHAL" selected>Lethal Walls (Classic)</option>
                        <option value="TORUS">Infinite Wrap (Torus)</option>
                    </select>
                </div>

                <div>
                    <div class="panel-label">Base Velocity Limit</div>
                    <select id="speedSelect" class="form-select">
                        <option value="120">Operative (Slow)</option>
                        <option value="90" selected>Grandmaster (Normal)</option>
                        <option value="60">Leviathan (Fast)</option>
                    </select>
                </div>
                
                <div>
                    <div class="panel-label">Hostile Geometry</div>
                    <select id="obstacleSelect" class="form-select">
                        <option value="OFF" selected>Disabled (Pure Survival)</option>
                        <option value="ON">Enabled (Concrete Blocks)</option>
                    </select>
                </div>

                <div style="border-top: 1px solid var(--nk-border); margin: 5px 0;"></div>
                
                <button class="btn-action btn-start" id="btnEngage" onclick="igniteOuroborosProtocol()"><i class="fas fa-power-off me-2"></i> Ignite Protocol</button>
                
                <div class="action-row">
                    <button class="btn-action" id="btnPause" onclick="togglePauseState()"><i class="fas fa-pause me-2"></i> Suspend</button>
                </div>

                <div id="systemStatus" style="text-align: center; margin-top: 15px; font-weight: bold; color: var(--nk-text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">
                    SYSTEM STANDBY
                </div>

            </div>

            <div class="arena-box" id="playArena">
                
                <div class="crt-overlay"></div>

                <div class="status-overlay" id="statusOverlay">
                    <div class="overlay-text" id="overlayText">FATAL COLLISION</div>
                    <div class="overlay-sub" id="overlaySub">Mass: 1 | Data: 0</div>
                    <button class="btn-action btn-start" style="width: auto; margin-top: 0; padding: 15px 30px; z-index: 20;" onclick="igniteOuroborosProtocol()">Reboot Engine</button>
                </div>

                <canvas id="kineticCanvas" width="400" height="400" tabindex="0"></canvas>

                <div class="d-pad-container">
                    <div class="d-pad-btn btn-up" onmousedown="injectDirectionVector('UP')" ontouchstart="injectDirectionVector('UP')"><i class="fas fa-chevron-up"></i></div>
                    <div class="d-pad-btn btn-left" onmousedown="injectDirectionVector('LEFT')" ontouchstart="injectDirectionVector('LEFT')"><i class="fas fa-chevron-left"></i></div>
                    <div class="d-pad-btn btn-down" onmousedown="injectDirectionVector('DOWN')" ontouchstart="injectDirectionVector('DOWN')"><i class="fas fa-chevron-down"></i></div>
                    <div class="d-pad-btn btn-right" onmousedown="injectDirectionVector('RIGHT')" ontouchstart="injectDirectionVector('RIGHT')"><i class="fas fa-chevron-right"></i></div>
                </div>

            </div>

        </div>

    </div>

    <script>
        // ==========================================
        // V100000 THEME ENGINE
        // ==========================================
        function toggleSnakeTheme() {
            let htmlElement = document.documentElement;
            let currentTheme = htmlElement.getAttribute('data-theme');
            let nextTheme;

            if (currentTheme === "light") {
                nextTheme = "dark";
            } else {
                nextTheme = "light";
            }

            htmlElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('lisa_v100000_snake_theme', nextTheme);
        }

        function getThemeColors() {
            let computedStyle = getComputedStyle(document.body);
            return {
                bg: computedStyle.getPropertyValue('--nk-surface').trim(),
                snake: computedStyle.getPropertyValue('--nk-accent').trim(),
                food: computedStyle.getPropertyValue('--nk-food').trim(),
                golden: computedStyle.getPropertyValue('--nk-golden').trim(),
                obstacle: computedStyle.getPropertyValue('--nk-obstacle').trim(),
                grid: computedStyle.getPropertyValue('--nk-border').trim(),
                text: computedStyle.getPropertyValue('--nk-text').trim()
            };
        }

        // ==========================================
        // GLOBAL KINETIC MEMORY
        // ==========================================
        let canvasElement = document.getElementById('kineticCanvas');
        let canvasContext = canvasElement.getContext('2d');
        
        let gridScale = 20; 
        let tileCount = canvasElement.width / gridScale;

        let snakeVectorArray = [];
        let obstacleArray = [];
        let particleArray = [];
        let floatingTextArray = []; // V100000 feature
        
        let currentVelocityX = 1;
        let currentVelocityY = 0;
        let pendingVelocityX = 1;
        let pendingVelocityY = 0;
        let isInputLocked = false; 

        let targetFoodX = 15;
        let targetFoodY = 10;
        let goldenFoodObject = null;

        let currentScore = 0;
        let currentMass = 1;
        let peakHighScore = 0;
        
        let isEngineActive = false;
        let isEnginePaused = false;
        
        let logicAccumulatorMs = 0;
        let previousTimestampMs = 0;
        let currentSpeedDelayMs = 90;
        let animationFrameId = null;

        document.addEventListener("DOMContentLoaded", function() {
            let savedTheme = localStorage.getItem('lisa_v100000_snake_theme');
            if (savedTheme !== null) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
            
            let savedScore = localStorage.getItem('lisa_v100000_snake_high');
            if (savedScore !== null) {
                peakHighScore = parseInt(savedScore, 10);
                document.getElementById('hudHighScore').innerText = String(peakHighScore);
            }

            executeVisualRender();
        });

        // ==========================================
        // PROTOCOL CONTROL
        // ==========================================
        function togglePauseState() {
            if (isEngineActive === false) { return; }
            
            isEnginePaused = !isEnginePaused;
            
            let btnPause = document.getElementById('btnPause');
            let statusEl = document.getElementById('systemStatus');

            if (isEnginePaused === true) {
                btnPause.innerHTML = "<i class='fas fa-play me-2'></i> Resume";
                btnPause.style.background = "var(--nk-trying)";
                statusEl.innerText = "SYSTEM SUSPENDED";
                statusEl.style.color = "var(--nk-text)";
            } else {
                btnPause.innerHTML = "<i class='fas fa-pause me-2'></i> Suspend";
                btnPause.style.background = "var(--nk-surface)";
                statusEl.innerText = "PROTOCOL ACTIVE";
                statusEl.style.color = "var(--nk-accent)";
                
                previousTimestampMs = performance.now(); // Prevent time-jump catchup
            }
        }

        function igniteOuroborosProtocol() {
            if (animationFrameId !== null) {
                cancelAnimationFrame(animationFrameId);
            }

            document.getElementById('statusOverlay').style.display = "none";
            document.getElementById('systemStatus').innerText = "PROTOCOL ACTIVE";
            document.getElementById('systemStatus').style.color = "var(--nk-accent)";
            document.getElementById('btnEngage').innerText = "Restart Engine";
            document.getElementById('btnPause').innerHTML = "<i class='fas fa-pause me-2'></i> Suspend";
            document.getElementById('btnPause').style.background = "var(--nk-surface)";

            snakeVectorArray = [];
            snakeVectorArray.push({ x: 10, y: 10 });
            
            obstacleArray = [];
            particleArray = [];
            floatingTextArray = [];
            goldenFoodObject = null;

            currentVelocityX = 1;
            currentVelocityY = 0;
            pendingVelocityX = 1;
            pendingVelocityY = 0;
            isInputLocked = false;

            currentScore = 0;
            currentMass = 1;
            
            let speedString = document.getElementById('speedSelect').value;
            currentSpeedDelayMs = parseInt(speedString, 10);

            document.getElementById('hudScore').innerText = "0";
            document.getElementById('hudLength').innerText = "1";

            isEngineActive = true;
            isEnginePaused = false;

            spawnStandardFood(); 
            
            logicAccumulatorMs = 0;
            previousTimestampMs = performance.now();
            animationFrameId = requestAnimationFrame(unifiedKineticLoop);
            
            canvasElement.focus();
        }

        // ==========================================
        // V100000 UNIFIED DELTA-TIME LOOP
        // ==========================================
        function unifiedKineticLoop(currentTimestampMs) {
            if (isEngineActive === false) { return; }

            let deltaMs = currentTimestampMs - previousTimestampMs;
            previousTimestampMs = currentTimestampMs;

            if (isEnginePaused === false) {
                // Safeguard against massive tab-suspend jumps
                if (deltaMs > 1000) { deltaMs = 16; }

                logicAccumulatorMs = logicAccumulatorMs + deltaMs;

                // Execute logic ONLY ONCE per required threshold to prevent infinite cascades
                if (logicAccumulatorMs >= currentSpeedDelayMs) {
                    executeLogicalAdvance();
                    logicAccumulatorMs = 0; 
                }
                
                updatePhysicsEntities();
            }

            executeVisualRender();
            animationFrameId = requestAnimationFrame(unifiedKineticLoop);
        }

        function executeLogicalAdvance() {
            currentVelocityX = pendingVelocityX;
            currentVelocityY = pendingVelocityY;
            isInputLocked = false; 

            let currentHeadX = snakeVectorArray[0].x;
            let currentHeadY = snakeVectorArray[0].y;

            let nextHeadX = currentHeadX + currentVelocityX;
            let nextHeadY = currentHeadY + currentVelocityY;

            let boundaryMode = document.getElementById('boundarySelect').value;

            // Boundary
            if (boundaryMode === "LETHAL") {
                if (nextHeadX < 0 || nextHeadX >= tileCount || nextHeadY < 0 || nextHeadY >= tileCount) {
                    triggerFatalCollision("IMPACT DETECTED: PERIMETER WALL");
                    return;
                }
            } else if (boundaryMode === "TORUS") {
                if (nextHeadX < 0) { nextHeadX = tileCount - 1; }
                if (nextHeadX >= tileCount) { nextHeadX = 0; }
                if (nextHeadY < 0) { nextHeadY = tileCount - 1; }
                if (nextHeadY >= tileCount) { nextHeadY = 0; }
            }

            // Self Collision
            for (let i = 0; i < snakeVectorArray.length; i = i + 1) {
                if (snakeVectorArray[i].x === nextHeadX && snakeVectorArray[i].y === nextHeadY) {
                    triggerFatalCollision("IMPACT DETECTED: SELF");
                    return;
                }
            }

            // Obstacle Collision
            for (let i = 0; i < obstacleArray.length; i = i + 1) {
                if (obstacleArray[i].x === nextHeadX && obstacleArray[i].y === nextHeadY) {
                    triggerFatalCollision("IMPACT DETECTED: HOSTILE GEOMETRY");
                    return;
                }
            }

            let newHeadObject = { x: nextHeadX, y: nextHeadY };
            snakeVectorArray.unshift(newHeadObject);

            let ateGolden = false;
            
            if (goldenFoodObject !== null) {
                if (nextHeadX === goldenFoodObject.x && nextHeadY === goldenFoodObject.y) {
                    currentScore = currentScore + 50;
                    currentMass = currentMass + 1;
                    ateGolden = true;
                    
                    let colors = getThemeColors();
                    triggerParticleExplosion(goldenFoodObject.x, goldenFoodObject.y, colors.golden);
                    spawnFloatingText(goldenFoodObject.x, goldenFoodObject.y, "+50", colors.golden);
                    
                    goldenFoodObject = null;
                } else {
                    goldenFoodObject.timer = goldenFoodObject.timer - 1;
                    if (goldenFoodObject.timer <= 0) { goldenFoodObject = null; }
                }
            }

            if (nextHeadX === targetFoodX && nextHeadY === targetFoodY) {
                currentScore = currentScore + 10;
                currentMass = currentMass + 1;
                
                let colors = getThemeColors();
                triggerParticleExplosion(targetFoodX, targetFoodY, colors.food);
                spawnFloatingText(targetFoodX, targetFoodY, "+10", colors.text);

                if (currentSpeedDelayMs > 35) {
                    currentSpeedDelayMs = currentSpeedDelayMs - 1.5;
                }

                spawnStandardFood();
                
                let isObstaclesOn = document.getElementById('obstacleSelect').value === "ON";
                if (isObstaclesOn === true && currentMass % 5 === 0) {
                    spawnObstacleNode();
                }

                if (goldenFoodObject === null && Math.random() > 0.9) {
                    spawnGoldenFood();
                }

            } else {
                if (ateGolden === false) {
                    snakeVectorArray.pop(); 
                }
            }
            
            document.getElementById('hudScore').innerText = String(currentScore);
            document.getElementById('hudLength').innerText = String(currentMass);
        }

        // ==========================================
        // V100000 REPAIRED SAFE SPAWNERS
        // Isolated temporary variables guarantee no infinite loops
        // ==========================================
        
        function spawnStandardFood() {
            let tempX = 0; let tempY = 0;
            let isSafe = false;
            let escapeHatch = 0;

            while (isSafe === false && escapeHatch < 1000) {
                tempX = Math.floor(Math.random() * tileCount);
                tempY = Math.floor(Math.random() * tileCount);
                isSafe = true;

                for (let i = 0; i < snakeVectorArray.length; i = i + 1) {
                    if (snakeVectorArray[i].x === tempX && snakeVectorArray[i].y === tempY) { isSafe = false; }
                }
                for (let i = 0; i < obstacleArray.length; i = i + 1) {
                    if (obstacleArray[i].x === tempX && obstacleArray[i].y === tempY) { isSafe = false; }
                }
                if (goldenFoodObject !== null) {
                    if (goldenFoodObject.x === tempX && goldenFoodObject.y === tempY) { isSafe = false; }
                }
                escapeHatch = escapeHatch + 1;
            }

            targetFoodX = tempX;
            targetFoodY = tempY;
        }

        function spawnGoldenFood() {
            let tempX = 0; let tempY = 0;
            let isSafe = false;
            let escapeHatch = 0;

            while (isSafe === false && escapeHatch < 1000) {
                tempX = Math.floor(Math.random() * tileCount);
                tempY = Math.floor(Math.random() * tileCount);
                isSafe = true;

                for (let i = 0; i < snakeVectorArray.length; i = i + 1) {
                    if (snakeVectorArray[i].x === tempX && snakeVectorArray[i].y === tempY) { isSafe = false; }
                }
                for (let i = 0; i < obstacleArray.length; i = i + 1) {
                    if (obstacleArray[i].x === tempX && obstacleArray[i].y === tempY) { isSafe = false; }
                }
                if (targetFoodX === tempX && targetFoodY === tempY) { isSafe = false; }

                escapeHatch = escapeHatch + 1;
            }

            goldenFoodObject = { x: tempX, y: tempY, timer: 45 };
        }

        function spawnObstacleNode() {
            let tempX = 0; let tempY = 0;
            let isSafe = false;
            let escapeHatch = 0;

            while (isSafe === false && escapeHatch < 1000) {
                tempX = Math.floor(Math.random() * tileCount);
                tempY = Math.floor(Math.random() * tileCount);
                isSafe = true;

                for (let i = 0; i < snakeVectorArray.length; i = i + 1) {
                    if (snakeVectorArray[i].x === tempX && snakeVectorArray[i].y === tempY) { isSafe = false; }
                }
                for (let i = 0; i < obstacleArray.length; i = i + 1) {
                    if (obstacleArray[i].x === tempX && obstacleArray[i].y === tempY) { isSafe = false; }
                }
                if (targetFoodX === tempX && targetFoodY === tempY) { isSafe = false; }
                if (goldenFoodObject !== null) {
                    if (goldenFoodObject.x === tempX && goldenFoodObject.y === tempY) { isSafe = false; }
                }

                // Never spawn right in front of snake
                if (isSafe === true) {
                    let headX = snakeVectorArray[0].x;
                    let headY = snakeVectorArray[0].y;
                    let distance = Math.abs(headX - tempX) + Math.abs(headY - tempY);
                    if (distance < 4) { isSafe = false; } 
                }
                escapeHatch = escapeHatch + 1;
            }
            obstacleArray.push({ x: tempX, y: tempY });
        }

        // ==========================================
        // KINETIC EFFECTS ENGINE
        // ==========================================
        function triggerParticleExplosion(gridX, gridY, colorString) {
            let pixelX = gridX * gridScale + (gridScale / 2);
            let pixelY = gridY * gridScale + (gridScale / 2);

            for (let i = 0; i < 15; i = i + 1) {
                let p = {
                    x: pixelX,
                    y: pixelY,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    life: 1.0,
                    decayRate: Math.random() * 0.05 + 0.03,
                    color: colorString
                };
                particleArray.push(p);
            }
        }

        function spawnFloatingText(gridX, gridY, textString, colorString) {
            let pixelX = gridX * gridScale + (gridScale / 2);
            let pixelY = gridY * gridScale;
            floatingTextArray.push({
                x: pixelX,
                y: pixelY,
                text: textString,
                life: 1.0,
                color: colorString
            });
        }

        function updatePhysicsEntities() {
            // Particles
            for (let i = particleArray.length - 1; i >= 0; i = i - 1) {
                let p = particleArray[i];
                p.x = p.x + p.vx;
                p.y = p.y + p.vy;
                p.life = p.life - p.decayRate;
                if (p.life <= 0) { particleArray.splice(i, 1); }
            }
            // Floating Text
            for (let i = floatingTextArray.length - 1; i >= 0; i = i - 1) {
                let ft = floatingTextArray[i];
                ft.y = ft.y - 1; // Float upwards
                ft.life = ft.life - 0.02;
                if (ft.life <= 0) { floatingTextArray.splice(i, 1); }
            }
        }

        // ==========================================
        // V100000 RENDERER
        // ==========================================
        function executeVisualRender() {
            let colors = getThemeColors();

            canvasContext.fillStyle = colors.bg;
            canvasContext.fillRect(0, 0, canvasElement.width, canvasElement.height);

            canvasContext.strokeStyle = colors.grid;
            canvasContext.lineWidth = 0.5;
            for (let i = 0; i <= tileCount; i = i + 1) {
                canvasContext.beginPath();
                canvasContext.moveTo(i * gridScale, 0);
                canvasContext.lineTo(i * gridScale, canvasElement.height);
                canvasContext.stroke();

                canvasContext.beginPath();
                canvasContext.moveTo(0, i * gridScale);
                canvasContext.lineTo(canvasElement.width, i * gridScale);
                canvasContext.stroke();
            }

            // Draw Particles
            for (let i = 0; i < particleArray.length; i = i + 1) {
                let p = particleArray[i];
                canvasContext.globalAlpha = p.life;
                canvasContext.fillStyle = p.color;
                let size = 5 * p.life;
                canvasContext.fillRect(p.x, p.y, size, size);
            }
            canvasContext.globalAlpha = 1.0;

            if (snakeVectorArray.length === 0) { return; }

            // Draw Obstacles
            canvasContext.fillStyle = colors.obstacle;
            for (let i = 0; i < obstacleArray.length; i = i + 1) {
                let obs = obstacleArray[i];
                canvasContext.fillRect(obs.x * gridScale + 1, obs.y * gridScale + 1, gridScale - 2, gridScale - 2);
            }

            // Draw Standard Food
            canvasContext.fillStyle = colors.food;
            let foodBreath = Math.abs(Math.sin(Date.now() / 200)) * 2;
            canvasContext.fillRect((targetFoodX * gridScale) + foodBreath, (targetFoodY * gridScale) + foodBreath, gridScale - (foodBreath * 2), gridScale - (foodBreath * 2));

            // Draw Golden Food
            if (goldenFoodObject !== null) {
                canvasContext.fillStyle = colors.golden;
                let goldBreath = Math.abs(Math.cos(Date.now() / 100)) * 3;
                canvasContext.fillRect((goldenFoodObject.x * gridScale) + goldBreath, (goldenFoodObject.y * gridScale) + goldBreath, gridScale - (goldBreath * 2), gridScale - (goldBreath * 2));
            }

            // Draw Biological Snake Fade
            canvasContext.fillStyle = colors.snake;
            for (let i = 0; i < snakeVectorArray.length; i = i + 1) {
                let segment = snakeVectorArray[i];
                
                if (i === 0) {
                    canvasContext.fillStyle = "#ffffff"; 
                    canvasContext.globalAlpha = 1.0;
                } else {
                    canvasContext.fillStyle = colors.snake;
                    let fadeFactor = 1.0 - (i / snakeVectorArray.length);
                    if (fadeFactor < 0.3) { fadeFactor = 0.3; } // Cap minimum opacity
                    canvasContext.globalAlpha = fadeFactor;
                }

                // Use circles for organic feel
                canvasContext.beginPath();
                canvasContext.arc(segment.x * gridScale + (gridScale/2), segment.y * gridScale + (gridScale/2), (gridScale/2) - 1, 0, 2 * Math.PI);
                canvasContext.fill();
            }
            canvasContext.globalAlpha = 1.0;

            // Draw Floating Text
            canvasContext.font = "bold 16px Courier New";
            canvasContext.textAlign = "center";
            for (let i = 0; i < floatingTextArray.length; i = i + 1) {
                let ft = floatingTextArray[i];
                canvasContext.globalAlpha = ft.life;
                canvasContext.fillStyle = ft.color;
                canvasContext.fillText(ft.text, ft.x, ft.y);
            }
            canvasContext.globalAlpha = 1.0;
        }

        function triggerFatalCollision(reasonString) {
            isEngineActive = false;
            
            document.getElementById('systemStatus').innerText = "SYSTEM HALTED";
            document.getElementById('systemStatus').style.color = "var(--nk-error)";
            
            if (currentScore > peakHighScore) {
                peakHighScore = currentScore;
                document.getElementById('hudHighScore').innerText = String(peakHighScore);
                localStorage.setItem('lisa_v100000_snake_high', String(peakHighScore));
            }

            document.getElementById('overlayText').innerText = "FATAL COLLISION";
            document.getElementById('overlaySub').innerText = "Mass: " + String(currentMass) + " | Data: " + String(currentScore) + "\n" + reasonString;
            document.getElementById('statusOverlay').style.display = "flex";
            document.getElementById('btnEngage').innerText = "Reboot Engine";
        }

        // ==========================================
        // V100000 HARDWARE & D-PAD LISTENERS
        // ==========================================
        function injectDirectionVector(directionString) {
            if (isEngineActive === false || isEnginePaused === true || isInputLocked === true) { return; }

            let moveApplied = false;

            if (directionString === "LEFT" && currentVelocityX !== 1) {
                pendingVelocityX = -1; pendingVelocityY = 0; moveApplied = true;
            } else if (directionString === "RIGHT" && currentVelocityX !== -1) {
                pendingVelocityX = 1; pendingVelocityY = 0; moveApplied = true;
            } else if (directionString === "UP" && currentVelocityY !== 1) {
                pendingVelocityX = 0; pendingVelocityY = -1; moveApplied = true;
            } else if (directionString === "DOWN" && currentVelocityY !== -1) {
                pendingVelocityX = 0; pendingVelocityY = 1; moveApplied = true;
            }

            if (moveApplied === true) {
                isInputLocked = true; 
            }
        }

        document.addEventListener('keydown', function(eventObject) {
            let keyName = eventObject.key;
            
            if (keyName === "ArrowLeft" || keyName === "ArrowRight" || keyName === "ArrowUp" || keyName === "ArrowDown") {
                eventObject.preventDefault(); 
            }

            if (keyName === "ArrowLeft" || keyName === "a" || keyName === "A") { injectDirectionVector("LEFT"); }
            if (keyName === "ArrowRight" || keyName === "d" || keyName === "D") { injectDirectionVector("RIGHT"); }
            if (keyName === "ArrowUp" || keyName === "w" || keyName === "W") { injectDirectionVector("UP"); }
            if (keyName === "ArrowDown" || keyName === "s" || keyName === "S") { injectDirectionVector("DOWN"); }
        });

    </script>
