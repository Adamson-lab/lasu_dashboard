<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Academic Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <style>
        body { background-color: #f8f9fa; }
        #calendar { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); min-height: 800px; }
        .fc-event { cursor: pointer; }
    </style>

    
    

    <link rel="icon" type="image/jpeg" sizes="32x32" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
    <link rel="icon" type="image/jpeg" sizes="16x16" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand fw-bold">📅 Academic Calendar</span>
        <a href="{{ url_for('student_portal') }}" class="btn btn-outline-light btn-sm">Back to Dashboard</a>
    </div>
</nav>

<div class="container mb-5">
    <div class="row">
        <div class="col-md-3">
            <div class="card shadow-sm mb-3">
                <div class="card-header bg-dark text-white fw-bold">Legend</div>
                <div class="card-body">
                    <div class="d-flex align-items-center mb-2">
                        <div style="width: 20px; height: 20px; background: #0d6efd; margin-right: 10px; border-radius: 3px;"></div>
                        <span>Classes</span>
                    </div>
                    <div class="d-flex align-items-center">
                        <div style="width: 20px; height: 20px; background: #dc3545; margin-right: 10px; border-radius: 3px;"></div>
                        <span>Assignment Deadlines</span>
                    </div>
                </div>
            </div>
            <div class="alert alert-info small">
                Click on any "Deadline" event to go directly to the submission page.
            </div>
        </div>
        <div class="col-md-9">
            <div id='calendar'></div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'timeGridWeek', // Default to Weekly View
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            slotMinTime: "07:00:00", // Calendar starts at 7 AM
            slotMaxTime: "20:00:00", // Calendar ends at 8 PM
            events: '/api/student/calendar', // Fetch from our Python API
            
            eventDidMount: function(info) {
                // Add tooltip for extra info (like Venue)
                if (info.event.extendedProps.description) {
                    info.el.title = info.event.extendedProps.description;
                }
            }
        });
        calendar.render();
    });
</script>

</body>
</html>
