<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V16000 Omni-Strike Matrix | L.I.S.A. Utilities</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* ==========================================
           V16000 OMNI-STRIKE THEME ENGINE
           ========================================== */
        
        [data-theme="dark"] {
            --nk-bg: #0b0f19;
            --nk-surface: #131a2a;
            --nk-text: #e2e8f0;
            --nk-text-muted: #475569;
            --nk-accent: #dc3545; /* Tactical Red */
            --nk-accent-glow: rgba(220, 53, 69, 0.3);
            --nk-player-x: #0ea5e9; /* Player X: Blue */
            --nk-player-o: #dc3545; /* Player O: Red */
            --nk-border: #1e293b;
            --grid-bg: #070a10;
        }

        [data-theme="light"] {
            --nk-bg: #f8fafc;
            --nk-surface: #ffffff;
            --nk-text: #0f172a;
            --nk-text-muted: #94a3b8;
            --nk-accent: #b91c1c; 
            --nk-accent-glow: rgba(185, 28, 28, 0.2);
            --nk-player-x: #2563eb;
            --nk-player-o: #b91c1c;
            --nk-border: #cbd5e1;
            --grid-bg: #e2e8f0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--nk-bg);
            color: var(--nk-text);
            transition: all 0.3s ease;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        .test-container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        /* HUD Header */
        .nk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--nk-border);
        }

        .nk-title {
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            color: var(--nk-accent);
            text-shadow: 0 0 15px var(--nk-accent-glow);
        }

        .btn-nav {
            background: transparent;
            color: var(--nk-text);
            border: 1px solid var(--nk-border);
            padding: 10px 20px;
            font-weight: 900;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            border-radius: 4px;
        }
        .btn-nav:hover { background: var(--nk-surface); border-color: var(--nk-accent); color: var(--nk-accent); }

        /* Telemetry Dashboard */
        .telemetry-dash {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .telemetry-node {
            background: var(--nk-surface);
            border: 1px solid var(--nk-border);
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            position: relative;
        }

        .node-val {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--nk-text);
            line-height: 1;
            margin-bottom: 5px;
        }

        .node-lbl {
            font-size: 0.75rem;
            font-weight: 900;
            color: var(--nk-text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-purge {
            position: absolute;
            top: 5px; right: 5px;
            background: transparent; border: none; color: var(--nk-text-muted);
            font-size: 0.7rem; cursor: pointer;
        }
        .btn-purge:hover { color: var(--nk-error); }

        /* Layout Structure */
        .main-layout {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            justify-content: center;
        }

        @media (max-width: 800px) {
            .main-layout { flex-direction: column-reverse; align-items: center; }
            .control-panel { width: 100%; max-width: 450px; }
        }

        /* Control Panel */
        .control-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--nk-surface);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--nk-border);
            min-width: 280px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .panel-label {
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--nk-text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .form-select {
            background-color: var(--nk-bg);
            color: var(--nk-text);
            border: 2px solid var(--nk-border);
            padding: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            outline: none;
            width: 100%;
        }
        .form-select:focus { border-color: var(--nk-accent); }

        .btn-action {
            background: var(--nk-surface);
            color: var(--nk-text);
            border: 2px solid var(--nk-border);
            padding: 12px 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
            flex-grow: 1;
        }
        .btn-action:hover { border-color: var(--nk-text); }
        .btn-action.active-btn { background: var(--nk-text); color: var(--nk-bg); border-color: var(--nk-text); }
        
        .btn-start {
            background: var(--nk-accent);
            color: #ffffff;
            border: none;
            margin-top: 10px;
            padding: 15px;
            font-size: 1.1rem;
            width: 100%;
        }
        .btn-start:hover { transform: translateY(-2px); box-shadow: 0 5px 15px var(--nk-accent-glow); border: none; }

        /* The Dynamic Grid */
        .arena-box {
            background-color: var(--grid-bg);
            border-radius: 12px;
            padding: 15px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border: 4px solid var(--nk-border);
        }

        .grid-container {
            display: grid;
            gap: 10px;
            /* Grid Template Columns handled via JS based on selected size */
        }

        .grid-cell {
            background-color: var(--nk-surface);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: 900;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: var(--nk-text);
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
            aspect-ratio: 1 / 1; /* Perfect squares */
        }
        .grid-cell:hover { background-color: var(--nk-bg); }
        .grid-cell:active { transform: scale(0.95); }

        /* Symbol Colors */
        .symbol-x { color: var(--nk-player-x); text-shadow: 0 0 20px rgba(14, 165, 233, 0.4); }
        .symbol-o { color: var(--nk-player-o); text-shadow: 0 0 20px rgba(220, 53, 69, 0.4); }

        /* V16000 Winning Line Highlight */
        .cell-win { background-color: var(--nk-border) !important; transform: scale(1.05); z-index: 5; box-shadow: inset 0 0 0 3px var(--nk-text); }

        /* Status Overlay */
        .status-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            display: none;
        }

        .overlay-text {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-align: center;
            padding: 0 20px;
        }

        @media (max-width: 500px) {
            .grid-cell { font-size: 2.5rem; }
            .overlay-text { font-size: 2rem; }
        }

    </style>

    
    

    <link rel="icon" type="image/jpeg" sizes="32x32" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
    <link rel="icon" type="image/jpeg" sizes="16x16" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
</head>
<body>

    <div class="test-container">
        
        <div class="nk-header">
            <div>
                <h1 class="nk-title">Omni-Strike Matrix</h1>
                <div style="font-size: 0.8rem; font-weight: bold; color: var(--nk-text-muted); letter-spacing: 3px; margin-top: 5px;">V16000 Adversarial Grid Engine</div>
            </div>
            <div class="d-flex gap-3">
                <button class="btn-nav" onclick="toggleTacticalTheme()"><i class="fas fa-adjust"></i></button>
                <a href="{{ url_for('student_tools_dashboard') }}" class="btn-nav"><i class="fas fa-arrow-left me-2"></i> Dashboard</a>
            </div>
        </div>

        <div class="telemetry-dash">
            <div class="telemetry-node">
                <button class="btn-purge" onclick="purgeTelemetry()" title="Reset Stats"><i class="fas fa-trash"></i></button>
                <div class="node-val" id="hudWins" style="color: var(--nk-player-x);">0</div>
                <div class="node-lbl">Player 1 (X)</div>
            </div>
            <div class="telemetry-node">
                <div class="node-val" id="hudDraws" style="color: var(--nk-text-muted);">0</div>
                <div class="node-lbl">Stalemates</div>
            </div>
            <div class="telemetry-node">
                <div class="node-val" id="hudLosses" style="color: var(--nk-player-o);">0</div>
                <div class="node-lbl">Player 2 (O)</div>
            </div>
        </div>

        <div class="main-layout">
            
            <div class="control-panel">
                
                <div>
                    <div class="panel-label">Matrix Dimensions</div>
                    <select id="gridSizeSelect" class="form-select" onchange="executeSystemReboot()">
                        <option value="3" selected>3 x 3 (Classic)</option>
                        <option value="4">4 x 4 (Connect-4)</option>
                        <option value="5">5 x 5 (Gomoku)</option>
                    </select>
                </div>

                <div class="mt-2">
                    <div class="panel-label">Opponent Engine</div>
                    <select id="difficultySelect" class="form-select">
                        <option value="HUMAN">Local Human (PvP)</option>
                        <option value="NOVICE">AI: Initiate (Random)</option>
                        <option value="OPERATIVE">AI: Operative (Defensive)</option>
                        <option value="GRANDMASTER" selected>AI: Grandmaster (Alpha-Beta)</option>
                    </select>
                </div>

                <div style="border-top: 1px solid var(--nk-border); margin: 5px 0;"></div>

                <div class="panel-label">Select Identity (PvE Mode)</div>
                <div class="d-flex gap-2">
                    <button class="btn-action active-btn" id="btnPlayX" onclick="setPlayerIdentity('X')">Play as X</button>
                    <button class="btn-action" id="btnPlayO" onclick="setPlayerIdentity('O')">Play as O</button>
                </div>
                
                <button class="btn-action btn-start" onclick="executeSystemReboot()"><i class="fas fa-power-off me-2"></i> Reboot Matrix</button>

                <div id="systemStatus" style="text-align: center; margin-top: 15px; font-weight: bold; color: var(--nk-text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">
                    SYSTEM STANDBY
                </div>

            </div>

            <div class="arena-box">
                
                <div class="status-overlay" id="statusOverlay">
                    <div class="overlay-text" id="overlayText">DRAW</div>
                    <button class="btn-action btn-start" style="width: auto;" onclick="executeSystemReboot()">Re-engage Matrix</button>
                </div>

                <div class="grid-container" id="gridContainer">
                    </div>

            </div>

        </div>

    </div>

    <script>
        // ==========================================
        // V16000 THEME ENGINE
        // ==========================================
        function toggleTacticalTheme() {
            let htmlElement = document.documentElement;
            let currentTheme = htmlElement.getAttribute('data-theme');
            let nextTheme;

            if (currentTheme === "light") {
                nextTheme = "dark";
            } else {
                nextTheme = "light";
            }

            htmlElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('lisa_v16000_tictactoe_theme', nextTheme);
        }

        // ==========================================
        // GLOBAL MEMORY REGISTERS
        // ==========================================
        let gameBoardArray = [];
        let currentGridSize = 3;
        let targetWinLength = 3;
        
        let humanIdentity = "X";
        let aiIdentity = "O";
        let currentTurn = "X"; // X always goes first
        let isGridLocked = false;
        
        let statWins = 0;
        let statLosses = 0;
        let statDraws = 0;

        document.addEventListener("DOMContentLoaded", function() {
            let savedTheme = localStorage.getItem('lisa_v16000_tictactoe_theme');
            if (savedTheme !== null) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
            
            // Load persistent telemetry
            let loadedWins = localStorage.getItem('lisa_v16000_wins');
            let loadedLosses = localStorage.getItem('lisa_v16000_losses');
            let loadedDraws = localStorage.getItem('lisa_v16000_draws');

            if (loadedWins !== null) { statWins = parseInt(loadedWins, 10); }
            if (loadedLosses !== null) { statLosses = parseInt(loadedLosses, 10); }
            if (loadedDraws !== null) { statDraws = parseInt(loadedDraws, 10); }
            
            updateTelemetryDOM();
            executeSystemReboot();
        });

        // ==========================================
        // UI CONTROLLERS
        // ==========================================
        function setPlayerIdentity(identityString) {
            humanIdentity = identityString;
            if (identityString === "X") {
                aiIdentity = "O";
                document.getElementById('btnPlayX').classList.add('active-btn');
                document.getElementById('btnPlayO').classList.remove('active-btn');
            } else {
                aiIdentity = "X";
                document.getElementById('btnPlayO').classList.add('active-btn');
                document.getElementById('btnPlayX').classList.remove('active-btn');
            }
            executeSystemReboot();
        }

        function updateStatusUI(messageString, colorVar) {
            let statusElement = document.getElementById('systemStatus');
            statusElement.innerText = messageString;
            if (colorVar !== "") {
                statusElement.style.color = colorVar;
            } else {
                statusElement.style.color = "var(--nk-text-muted)";
            }
        }

        function updateTelemetryDOM() {
            document.getElementById('hudWins').innerText = String(statWins);
            document.getElementById('hudLosses').innerText = String(statLosses);
            document.getElementById('hudDraws').innerText = String(statDraws);
            
            localStorage.setItem('lisa_v16000_wins', String(statWins));
            localStorage.setItem('lisa_v16000_losses', String(statLosses));
            localStorage.setItem('lisa_v16000_draws', String(statDraws));
        }

        function purgeTelemetry() {
            statWins = 0;
            statLosses = 0;
            statDraws = 0;
            updateTelemetryDOM();
        }

        // ==========================================
        // DYNAMIC GRID GENERATOR
        // ==========================================
        function getCellSize(sizeInteger) {
            if (sizeInteger === 3) { return "120px"; }
            if (sizeInteger === 4) { return "90px"; }
            if (sizeInteger === 5) { return "75px"; }
            return "100px";
        }
        function getCellFontSize(sizeInteger) {
            if (sizeInteger === 3) { return "5rem"; }
            if (sizeInteger === 4) { return "3.5rem"; }
            if (sizeInteger === 5) { return "2.5rem"; }
            return "3rem";
        }

        function executeSystemReboot() {
            let sizeSelectString = document.getElementById('gridSizeSelect').value;
            currentGridSize = parseInt(sizeSelectString, 10);
            
            // Win condition logic: 3x3 needs 3, 4x4 needs 4, 5x5 needs 4
            if (currentGridSize === 3) { targetWinLength = 3; }
            if (currentGridSize === 4) { targetWinLength = 4; }
            if (currentGridSize === 5) { targetWinLength = 4; }

            gameBoardArray = [];
            let totalCells = currentGridSize * currentGridSize;
            for (let i = 0; i < totalCells; i = i + 1) {
                gameBoardArray.push("");
            }

            currentTurn = "X"; // X always starts
            isGridLocked = false;
            document.getElementById('statusOverlay').style.display = "none";

            // Physically build grid
            let containerElement = document.getElementById('gridContainer');
            containerElement.innerHTML = "";
            containerElement.style.gridTemplateColumns = "repeat(" + String(currentGridSize) + ", 1fr)";
            
            let cellWidth = getCellSize(currentGridSize);
            let cellFont = getCellFontSize(currentGridSize);

            for (let i = 0; i < totalCells; i = i + 1) {
                let cellElement = document.createElement("div");
                cellElement.className = "grid-cell";
                cellElement.id = "c" + String(i);
                cellElement.style.width = cellWidth;
                cellElement.style.fontSize = cellFont;
                
                // Closure to lock index
                cellElement.addEventListener('mousedown', (function(lockedIndex) {
                    return function() { handleHumanStrike(lockedIndex); };
                })(i));

                containerElement.appendChild(cellElement);
            }

            let opponentMode = document.getElementById('difficultySelect').value;

            if (opponentMode === "HUMAN") {
                updateStatusUI("PLAYER X TURN", "var(--nk-player-x)");
            } else {
                if (currentTurn === humanIdentity) {
                    updateStatusUI("YOUR TURN", "var(--nk-player-x)");
                } else {
                    updateStatusUI("AI COMPUTING...", "var(--nk-accent)");
                    isGridLocked = true;
                    setTimeout(executeAITurn, 600);
                }
            }
        }

        function renderPhysicalMove(indexInteger, identityString) {
            gameBoardArray[indexInteger] = identityString;
            
            let cellElement = document.getElementById("c" + String(indexInteger));
            cellElement.innerText = identityString;
            
            if (identityString === "X") {
                cellElement.classList.add('symbol-x');
            } else {
                cellElement.classList.add('symbol-o');
            }
        }

        // ==========================================
        // COMBAT MECHANICS
        // ==========================================
        function handleHumanStrike(indexInteger) {
            if (isGridLocked === true) { return; }
            if (gameBoardArray[indexInteger] !== "") { return; } 

            let opponentMode = document.getElementById('difficultySelect').value;

            if (opponentMode === "HUMAN") {
                // Local PvP Logic
                renderPhysicalMove(indexInteger, currentTurn);
                if (verifyEndState() === true) { return; }
                
                // Swap Turn
                if (currentTurn === "X") {
                    currentTurn = "O";
                    updateStatusUI("PLAYER O TURN", "var(--nk-player-o)");
                } else {
                    currentTurn = "X";
                    updateStatusUI("PLAYER X TURN", "var(--nk-player-x)");
                }

            } else {
                // PvE Logic
                renderPhysicalMove(indexInteger, humanIdentity);
                if (verifyEndState() === true) { return; }

                currentTurn = aiIdentity;
                isGridLocked = true;
                updateStatusUI("AI COMPUTING...", "var(--nk-accent)");
                
                setTimeout(executeAITurn, 400); // 400ms psychological delay
            }
        }

        function executeAITurn() {
            let difficultyLevel = document.getElementById('difficultySelect').value;
            let targetIndex = -1;

            if (difficultyLevel === "NOVICE") {
                targetIndex = calculateRandomMove();
            } else if (difficultyLevel === "OPERATIVE") {
                targetIndex = calculateDefensiveMove();
                if (targetIndex === -1) { targetIndex = calculateRandomMove(); }
            } else if (difficultyLevel === "GRANDMASTER") {
                targetIndex = calculateMinimaxMove();
            }

            if (targetIndex === -1) { targetIndex = calculateRandomMove(); }

            renderPhysicalMove(targetIndex, aiIdentity);

            if (verifyEndState() === true) { return; }

            currentTurn = humanIdentity;
            isGridLocked = false;
            updateStatusUI("YOUR TURN", "var(--nk-player-x)");
        }

        // ==========================================
        // DYNAMIC VICTORY MATRIX 
        // ==========================================
        function scanForWinner(boardState, sizeInt, winLengthInt) {
            
            for (let r = 0; r < sizeInt; r = r + 1) {
                for (let c = 0; c < sizeInt; c = c + 1) {
                    
                    let cellIndex = (r * sizeInt) + c;
                    let playerCode = boardState[cellIndex];
                    
                    if (playerCode === "") { continue; }

                    // Horizontal Right
                    if (c <= sizeInt - winLengthInt) {
                        let winFound = true;
                        for (let i = 1; i < winLengthInt; i = i + 1) {
                            if (boardState[(r * sizeInt) + (c + i)] !== playerCode) { winFound = false; break; }
                        }
                        if (winFound === true) { return { winner: playerCode, pattern: "RIGHT", r: r, c: c }; }
                    }

                    // Vertical Down
                    if (r <= sizeInt - winLengthInt) {
                        let winFound = true;
                        for (let i = 1; i < winLengthInt; i = i + 1) {
                            if (boardState[((r + i) * sizeInt) + c] !== playerCode) { winFound = false; break; }
                        }
                        if (winFound === true) { return { winner: playerCode, pattern: "DOWN", r: r, c: c }; }
                    }

                    // Diagonal Down-Right
                    if (r <= sizeInt - winLengthInt && c <= sizeInt - winLengthInt) {
                        let winFound = true;
                        for (let i = 1; i < winLengthInt; i = i + 1) {
                            if (boardState[((r + i) * sizeInt) + (c + i)] !== playerCode) { winFound = false; break; }
                        }
                        if (winFound === true) { return { winner: playerCode, pattern: "DOWN_RIGHT", r: r, c: c }; }
                    }

                    // Diagonal Up-Right
                    if (r >= winLengthInt - 1 && c <= sizeInt - winLengthInt) {
                        let winFound = true;
                        for (let i = 1; i < winLengthInt; i = i + 1) {
                            if (boardState[((r - i) * sizeInt) + (c + i)] !== playerCode) { winFound = false; break; }
                        }
                        if (winFound === true) { return { winner: playerCode, pattern: "UP_RIGHT", r: r, c: c }; }
                    }
                }
            }
            return null;
        }

        function isGridFull(boardState) {
            for (let i = 0; i < boardState.length; i = i + 1) {
                if (boardState[i] === "") { return false; }
            }
            return true;
        }

        function verifyEndState() {
            let winObject = scanForWinner(gameBoardArray, currentGridSize, targetWinLength);
            
            if (winObject !== null) {
                isGridLocked = true;
                triggerVictorySequence(winObject);
                return true;
            }

            if (isGridFull(gameBoardArray) === true) {
                isGridLocked = true;
                triggerDrawSequence();
                return true;
            }

            return false;
        }

        function triggerVictorySequence(winObject) {
            let overlayElement = document.getElementById('statusOverlay');
            let textElement = document.getElementById('overlayText');
            let opponentMode = document.getElementById('difficultySelect').value;

            overlayElement.style.display = "flex";

            if (opponentMode === "HUMAN") {
                if (winObject.winner === "X") {
                    textElement.innerText = "PLAYER X WINS";
                    textElement.style.color = "var(--nk-player-x)";
                    statWins = statWins + 1;
                    updateStatusUI("PLAYER X DOMINANCE", "var(--nk-player-x)");
                } else {
                    textElement.innerText = "PLAYER O WINS";
                    textElement.style.color = "var(--nk-player-o)";
                    statLosses = statLosses + 1;
                    updateStatusUI("PLAYER O DOMINANCE", "var(--nk-player-o)");
                }
            } else {
                if (winObject.winner === humanIdentity) {
                    textElement.innerText = "HUMAN VICTORY";
                    textElement.style.color = "var(--nk-player-x)";
                    statWins = statWins + 1;
                    updateStatusUI("HUMAN DOMINANCE ACHIEVED", "var(--nk-player-x)");
                } else {
                    textElement.innerText = "SYSTEM FATALITY";
                    textElement.style.color = "var(--nk-accent)";
                    statLosses = statLosses + 1;
                    updateStatusUI("AI DOMINANCE ACHIEVED", "var(--nk-accent)");
                }
            }

            updateTelemetryDOM();

            // Highlight Winning Cells using the Vector Object
            let r = winObject.r;
            let c = winObject.c;
            let pattern = winObject.pattern;

            for (let i = 0; i < targetWinLength; i = i + 1) {
                let targetId = -1;
                if (pattern === "RIGHT") { targetId = (r * currentGridSize) + (c + i); }
                if (pattern === "DOWN") { targetId = ((r + i) * currentGridSize) + c; }
                if (pattern === "DOWN_RIGHT") { targetId = ((r + i) * currentGridSize) + (c + i); }
                if (pattern === "UP_RIGHT") { targetId = ((r - i) * currentGridSize) + (c + i); }

                if (targetId !== -1) {
                    let cellElem = document.getElementById("c" + String(targetId));
                    if (cellElem !== null) {
                        cellElem.classList.add("cell-win");
                    }
                }
            }
        }

        function triggerDrawSequence() {
            let overlayElement = document.getElementById('statusOverlay');
            let textElement = document.getElementById('overlayText');

            overlayElement.style.display = "flex";
            textElement.innerText = "STALEMATE";
            textElement.style.color = "var(--nk-text)";
            
            statDraws = statDraws + 1;
            updateTelemetryDOM();
            updateStatusUI("TACTICAL STALEMATE", "var(--nk-text-muted)");
        }

        // ==========================================
        // V16000 ALPHA-BETA MINIMAX AI
        // ==========================================

        function calculateRandomMove() {
            let availableIndexes = [];
            for (let i = 0; i < gameBoardArray.length; i = i + 1) {
                if (gameBoardArray[i] === "") { availableIndexes.push(i); }
            }
            if (availableIndexes.length > 0) {
                let randomPos = Math.floor(Math.random() * availableIndexes.length);
                return availableIndexes[randomPos];
            }
            return -1;
        }

        function calculateOffensiveMove() {
            for (let i = 0; i < gameBoardArray.length; i = i + 1) {
                if (gameBoardArray[i] === "") {
                    gameBoardArray[i] = aiIdentity;
                    if (scanForWinner(gameBoardArray, currentGridSize, targetWinLength) !== null) {
                        gameBoardArray[i] = ""; 
                        return i;
                    }
                    gameBoardArray[i] = ""; 
                }
            }
            return -1;
        }

        function calculateDefensiveMove() {
            // First check if AI can win
            let offense = calculateOffensiveMove();
            if (offense !== -1) { return offense; }

            // Block Human win
            for (let i = 0; i < gameBoardArray.length; i = i + 1) {
                if (gameBoardArray[i] === "") {
                    gameBoardArray[i] = humanIdentity;
                    if (scanForWinner(gameBoardArray, currentGridSize, targetWinLength) !== null) {
                        gameBoardArray[i] = ""; 
                        return i;
                    }
                    gameBoardArray[i] = ""; 
                }
            }
            return -1;
        }

        function executeAlphaBetaEngine(boardState, depthCounter, isMaximizing, alphaVar, betaVar) {
            let winObject = scanForWinner(boardState, currentGridSize, targetWinLength);
            if (winObject !== null) {
                if (winObject.winner === aiIdentity) { return 100 - depthCounter; }
                if (winObject.winner === humanIdentity) { return -100 + depthCounter; }
            }
            
            if (isGridFull(boardState) === true) { return 0; }

            // Dynamic Thermal Throttling: Prevents browser lockup on large grids
            let maxDepthLimit = 8;
            if (currentGridSize === 4) { maxDepthLimit = 4; }
            if (currentGridSize === 5) { maxDepthLimit = 3; }

            if (depthCounter >= maxDepthLimit) {
                return 0; // Heuristic draw fallback
            }

            if (isMaximizing === true) {
                let bestValue = -10000;
                for (let i = 0; i < boardState.length; i = i + 1) {
                    if (boardState[i] === "") {
                        boardState[i] = aiIdentity;
                        let currentValue = executeAlphaBetaEngine(boardState, depthCounter + 1, false, alphaVar, betaVar);
                        boardState[i] = ""; 
                        
                        if (currentValue > bestValue) { bestValue = currentValue; }
                        if (bestValue > alphaVar) { alphaVar = bestValue; }
                        if (betaVar <= alphaVar) { break; } // Alpha-Beta Pruning
                    }
                }
                return bestValue;
            } else {
                let bestValue = 10000;
                for (let i = 0; i < boardState.length; i = i + 1) {
                    if (boardState[i] === "") {
                        boardState[i] = humanIdentity;
                        let currentValue = executeAlphaBetaEngine(boardState, depthCounter + 1, true, alphaVar, betaVar);
                        boardState[i] = ""; 
                        
                        if (currentValue < bestValue) { bestValue = currentValue; }
                        if (bestValue < betaVar) { betaVar = bestValue; }
                        if (betaVar <= alphaVar) { break; } // Alpha-Beta Pruning
                    }
                }
                return bestValue;
            }
        }

        function calculateMinimaxMove() {
            // Memory & CPU Protection for massive grids
            if (currentGridSize > 3) {
                let defensiveMove = calculateDefensiveMove();
                if (defensiveMove !== -1) { return defensiveMove; }
            }

            let bestScore = -10000;
            let targetMoveIndex = -1;

            let availableMoves = [];
            for (let i = 0; i < gameBoardArray.length; i = i + 1) {
                if (gameBoardArray[i] === "") { availableMoves.push(i); }
            }
            
            // First move center optimization
            if (availableMoves.length === gameBoardArray.length) {
                let centerPos = Math.floor((gameBoardArray.length - 1) / 2);
                return centerPos;
            }

            for (let i = 0; i < availableMoves.length; i = i + 1) {
                let moveIndex = availableMoves[i];
                gameBoardArray[moveIndex] = aiIdentity;
                let moveScore = executeAlphaBetaEngine(gameBoardArray, 0, false, -10000, 10000);
                gameBoardArray[moveIndex] = "";

                if (moveScore > bestScore) {
                    bestScore = moveScore;
                    targetMoveIndex = moveIndex;
                }
            }
            
            if (targetMoveIndex === -1 && availableMoves.length > 0) {
                let randomPos = Math.floor(Math.random() * availableMoves.length);
                return availableMoves[randomPos];
            }
            
            return targetMoveIndex;
        }

    </script>
