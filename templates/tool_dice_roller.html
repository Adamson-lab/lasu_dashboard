<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V500000 Polyhedral Matrix | L.I.S.A. Utilities</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* ==========================================
           V500000 POLYHEDRAL THEME ENGINE
           ========================================== */
        
        [data-theme="dark"] {
            --nk-bg: #05080f;
            --nk-surface: #101623;
            --nk-text: #e2e8f0;
            --nk-text-muted: #475569;
            --nk-accent: #8b5cf6; /* Plasma Purple */
            --nk-accent-glow: rgba(139, 92, 246, 0.4);
            --nk-crit-success: #f59e0b; /* Golden */
            --nk-crit-fail: #ef4444; /* Lethal Red */
            --nk-border: #1e293b;
            --grid-bg: #03050a;
        }

        [data-theme="light"] {
            --nk-bg: #f8fafc;
            --nk-surface: #ffffff;
            --nk-text: #0f172a;
            --nk-text-muted: #94a3b8;
            --nk-accent: #7c3aed; 
            --nk-accent-glow: rgba(124, 58, 237, 0.3);
            --nk-crit-success: #d97706;
            --nk-crit-fail: #dc2626;
            --nk-border: #cbd5e1;
            --grid-bg: #e2e8f0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--nk-bg);
            color: var(--nk-text);
            transition: all 0.3s ease;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        .test-container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        /* HUD Header */
        .nk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--nk-border);
        }

        .nk-title {
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            color: var(--nk-accent);
            text-shadow: 0 0 15px var(--nk-accent-glow);
        }

        .btn-nav {
            background: transparent;
            color: var(--nk-text);
            border: 1px solid var(--nk-border);
            padding: 10px 20px;
            font-weight: 900;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            border-radius: 4px;
        }
        .btn-nav:hover { background: var(--nk-surface); border-color: var(--nk-accent); color: var(--nk-accent); }

        /* Telemetry Dashboard */
        .telemetry-dash {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .telemetry-node {
            background: var(--nk-surface);
            border: 1px solid var(--nk-border);
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            position: relative;
        }

        .node-val {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--nk-text);
            line-height: 1;
            margin-bottom: 5px;
        }

        .node-lbl {
            font-size: 0.75rem;
            font-weight: 900;
            color: var(--nk-text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-purge {
            position: absolute;
            top: 5px; right: 5px;
            background: transparent; border: none; color: var(--nk-text-muted);
            font-size: 0.7rem; cursor: pointer;
        }
        .btn-purge:hover { color: var(--nk-crit-fail); }

        /* Layout Structure */
        .main-layout {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            justify-content: center;
        }

        @media (max-width: 900px) {
            .main-layout { flex-direction: column-reverse; align-items: center; }
            .control-panel, .arena-box { width: 100%; max-width: 500px; }
        }

        /* Control Panel */
        .control-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--nk-surface);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--nk-border);
            min-width: 320px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .panel-label {
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--nk-text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .form-select, .form-input {
            background-color: var(--nk-bg);
            color: var(--nk-text);
            border: 2px solid var(--nk-border);
            padding: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            outline: none;
            width: 100%;
        }
        .form-select:focus, .form-input:focus { border-color: var(--nk-accent); }

        /* Mode Buttons */
        .mode-row {
            display: flex;
            gap: 10px;
        }

        .btn-mode {
            flex: 1;
            background: var(--nk-bg);
            color: var(--nk-text-muted);
            border: 2px solid var(--nk-border);
            padding: 10px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-mode:hover { border-color: var(--nk-text); color: var(--nk-text); }
        .mode-active { background: var(--nk-text); color: var(--nk-bg) !important; border-color: var(--nk-text); }

        .btn-action {
            background: var(--nk-accent);
            color: #ffffff;
            border: none;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 0 20px var(--nk-accent-glow);
        }
        .btn-action:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 5px 25px var(--nk-accent-glow); }
        .btn-action:disabled { background: var(--nk-border); color: var(--nk-text-muted); cursor: not-allowed; transform: none; box-shadow: none; }

        /* The Quantum Rolling Arena */
        .arena-box {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        .die-chamber {
            background-color: var(--grid-bg);
            border-radius: 12px;
            border: 4px solid var(--nk-border);
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 10px 30px rgba(0,0,0,0.5);
            perspective: 1200px;
            overflow: hidden;
        }

        /* Particles Layer */
        .particle-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Physical Die */
        .physical-die {
            width: 150px;
            height: 150px;
            background-color: var(--nk-surface);
            border: 5px solid var(--nk-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            font-weight: 900;
            color: var(--nk-text);
            box-shadow: 0 0 40px var(--nk-accent-glow), inset 0 0 20px rgba(0,0,0,0.5);
            z-index: 5;
            transition: transform 0.1s;
            /* Geometric cut to look like a polyhedral die */
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        /* Critical States */
        .crit-success {
            border-color: var(--nk-crit-success) !important;
            color: var(--nk-crit-success) !important;
            box-shadow: 0 0 50px var(--nk-crit-success), inset 0 0 30px rgba(245, 158, 11, 0.2) !important;
        }
        .crit-fail {
            border-color: var(--nk-crit-fail) !important;
            color: var(--nk-crit-fail) !important;
            box-shadow: 0 0 50px var(--nk-crit-fail), inset 0 0 30px rgba(239, 68, 68, 0.2) !important;
        }

        /* History Ledger */
        .ledger-box {
            background-color: var(--nk-surface);
            border: 1px solid var(--nk-border);
            border-radius: 8px;
            height: 250px;
            padding: 15px;
            overflow-y: auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .ledger-entry {
            border-bottom: 1px dashed var(--nk-border);
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .ledger-entry:last-child { border-bottom: none; }

        .entry-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--nk-text-muted);
            text-transform: uppercase;
            font-weight: bold;
        }

        .entry-math {
            font-size: 1rem;
            color: var(--nk-text);
            font-family: 'Courier New', Courier, monospace;
        }

        .entry-total {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--nk-accent);
        }

    </style>

</head>
<body>

    <div class="test-container">
        
        <div class="nk-header">
            <div>
                <h1 class="nk-title">Polyhedral Matrix</h1>
                <div style="font-size: 0.8rem; font-weight: bold; color: var(--nk-text-muted); letter-spacing: 3px; margin-top: 5px;">V500000 Cryptographic RPG Engine</div>
            </div>
            <div class="d-flex gap-3">
                <button class="btn-nav" onclick="toggleDiceTheme()"><i class="fas fa-adjust"></i></button>
                <a href="{{ url_for('student_tools_dashboard') }}" class="btn-nav"><i class="fas fa-arrow-left me-2"></i> Dashboard</a>
            </div>
        </div>

        <div class="telemetry-dash">
            <div class="telemetry-node">
                <div class="node-val" id="hudTotalRolls">0</div>
                <div class="node-lbl">Total Matrices Rolled</div>
            </div>
            <div class="telemetry-node">
                <div class="node-val" id="hudCrits" style="color: var(--nk-crit-success);">0</div>
                <div class="node-lbl">Critical Successes</div>
            </div>
            <div class="telemetry-node">
                <div class="node-val" id="hudFails" style="color: var(--nk-crit-fail);">0</div>
                <div class="node-lbl">Critical Failures</div>
            </div>
        </div>

        <div class="main-layout">
            
            <div class="control-panel">
                
                <div>
                    <div class="panel-label">Polyhedral Geometry</div>
                    <select id="diceTypeSelect" class="form-select">
                        <option value="4">D4 (Tetrahedron)</option>
                        <option value="6">D6 (Cube)</option>
                        <option value="8">D8 (Octahedron)</option>
                        <option value="10">D10 (Pentagonal Trapezohedron)</option>
                        <option value="12">D12 (Dodecahedron)</option>
                        <option value="20" selected>D20 (Icosahedron)</option>
                        <option value="100">D100 (Percentile Sphere)</option>
                    </select>
                </div>

                <div>
                    <div class="panel-label">Quantity Matrix (1 - 10)</div>
                    <input type="number" id="diceQuantity" class="form-input" min="1" max="10" value="1">
                </div>

                <div>
                    <div class="panel-label">Mathematical Modifier</div>
                    <input type="number" id="diceModifier" class="form-input" value="0">
                </div>

                <div>
                    <div class="panel-label">Tactical Logic Mode</div>
                    <div class="mode-row">
                        <button class="btn-mode mode-active" id="modeNorm" onclick="setRollMode('NORMAL')">Normal</button>
                        <button class="btn-mode" id="modeAdv" onclick="setRollMode('ADVANTAGE')">Advantage</button>
                        <button class="btn-mode" id="modeDis" onclick="setRollMode('DISADVANTAGE')">Disadvantage</button>
                    </div>
                    <div style="font-size: 0.7rem; color: var(--nk-text-muted); margin-top: 5px;">*Adv/Dis automatically forces Quantity to 2.</div>
                </div>

                <div style="border-top: 1px solid var(--nk-border); margin: 5px 0;"></div>
                
                <button class="btn-action" id="btnRoll" onclick="executePolyhedralRoll()"><i class="fas fa-dice-d20 me-2"></i> Execute Roll</button>

            </div>

            <div class="arena-box">
                
                <div class="die-chamber">
                    <canvas class="particle-canvas" id="pCanvas"></canvas>
                    <div class="physical-die" id="centralDie">20</div>
                </div>

                <div class="ledger-box" id="ledgerContainer">
                    <div style="color: var(--nk-text-muted); text-align: center; margin-top: 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px;">Entropy Ledger Standby</div>
                </div>

            </div>

        </div>

    </div>

    <script>
        // ==========================================
        // V500000 THEME ENGINE
        // ==========================================
        function toggleDiceTheme() {
            let htmlElement = document.documentElement;
            let currentTheme = htmlElement.getAttribute('data-theme');
            let nextTheme;

            if (currentTheme === "light") {
                nextTheme = "dark";
            } else {
                nextTheme = "light";
            }

            htmlElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('lisa_v500000_dice_theme', nextTheme);
        }

        function getThemeColors() {
            let computedStyle = getComputedStyle(document.body);
            return {
                critSuccess: computedStyle.getPropertyValue('--nk-crit-success').trim(),
                critFail: computedStyle.getPropertyValue('--nk-crit-fail').trim(),
                accent: computedStyle.getPropertyValue('--nk-accent').trim()
            };
        }

        // ==========================================
        // GLOBAL REGISTERS
        // ==========================================
        let currentRollMode = "NORMAL";
        let isEngineLocked = false;
        
        let statTotalRolls = 0;
        let statCrits = 0;
        let statFails = 0;

        let scrambleIntervalObj = null;

        // Particle System Elements
        let canvasElement = document.getElementById('pCanvas');
        let canvasContext = canvasElement.getContext('2d');
        let particleArray = [];
        let animationFrameId = null;

        document.addEventListener("DOMContentLoaded", function() {
            let savedTheme = localStorage.getItem('lisa_v500000_dice_theme');
            if (savedTheme !== null) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
            
            // Setup Canvas Size
            let chamber = document.querySelector('.die-chamber');
            canvasElement.width = chamber.clientWidth;
            canvasElement.height = chamber.clientHeight;

            startParticleEngine();
        });

        // ==========================================
        // UI CONTROLLERS
        // ==========================================
        function setRollMode(modeString) {
            if (isEngineLocked === true) { return; }
            currentRollMode = modeString;
            
            document.getElementById('modeNorm').classList.remove('mode-active');
            document.getElementById('modeAdv').classList.remove('mode-active');
            document.getElementById('modeDis').classList.remove('mode-active');

            if (modeString === "NORMAL") {
                document.getElementById('modeNorm').classList.add('mode-active');
                document.getElementById('diceQuantity').disabled = false;
            } else if (modeString === "ADVANTAGE") {
                document.getElementById('modeAdv').classList.add('mode-active');
                document.getElementById('diceQuantity').value = "2";
                document.getElementById('diceQuantity').disabled = true;
            } else if (modeString === "DISADVANTAGE") {
                document.getElementById('modeDis').classList.add('mode-active');
                document.getElementById('diceQuantity').value = "2";
                document.getElementById('diceQuantity').disabled = true;
            }
        }

        function updateTelemetryHUD() {
            document.getElementById('hudTotalRolls').innerText = String(statTotalRolls);
            document.getElementById('hudCrits').innerText = String(statCrits);
            document.getElementById('hudFails').innerText = String(statFails);
        }

        function logToLedger(headerString, mathString, totalInt, isCrit, isFail) {
            let container = document.getElementById('ledgerContainer');
            
            // Remove standby message on first roll
            if (statTotalRolls === 1) { container.innerHTML = ""; }

            let entryDiv = document.createElement('div');
            entryDiv.className = "ledger-entry";

            let headerDiv = document.createElement('div');
            headerDiv.className = "entry-header";
            headerDiv.innerText = headerString;

            let mathDiv = document.createElement('div');
            mathDiv.className = "entry-math";
            mathDiv.innerText = mathString;

            let totalDiv = document.createElement('div');
            totalDiv.className = "entry-total";
            totalDiv.innerText = "TOTAL: " + String(totalInt);

            if (isCrit === true) { totalDiv.style.color = "var(--nk-crit-success)"; }
            if (isFail === true) { totalDiv.style.color = "var(--nk-crit-fail)"; }

            entryDiv.appendChild(headerDiv);
            entryDiv.appendChild(mathDiv);
            entryDiv.appendChild(totalDiv);

            // Prepend so newest is at the top
            container.insertBefore(entryDiv, container.firstChild);
        }

        // ==========================================
        // KINETIC PARTICLE ENGINE
        // ==========================================
        function startParticleEngine() {
            canvasContext.clearRect(0, 0, canvasElement.width, canvasElement.height);

            for (let i = particleArray.length - 1; i >= 0; i = i - 1) {
                let p = particleArray[i];
                p.x = p.x + p.vx;
                p.y = p.y + p.vy;
                p.life = p.life - p.decay;

                if (p.life <= 0) {
                    particleArray.splice(i, 1);
                } else {
                    canvasContext.globalAlpha = p.life;
                    canvasContext.fillStyle = p.color;
                    
                    canvasContext.beginPath();
                    canvasContext.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    canvasContext.fill();
                }
            }
            canvasContext.globalAlpha = 1.0;
            animationFrameId = requestAnimationFrame(startParticleEngine);
        }

        function detonateParticles(colorHex) {
            let centerX = canvasElement.width / 2;
            let centerY = canvasElement.height / 2;

            for (let i = 0; i < 40; i = i + 1) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 8 + 2;
                
                particleArray.push({
                    x: centerX,
                    y: centerY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: Math.random() * 0.03 + 0.02,
                    size: Math.random() * 4 + 2,
                    color: colorHex
                });
            }
        }

        // ==========================================
        // V500000 CORE PROBABILITY ENGINE
        // ZERO ARROW FUNCTIONS. ZERO TERNARIES.
        // ==========================================
        function executePolyhedralRoll() {
            if (isEngineLocked === true) { return; }
            isEngineLocked = true;

            let btnElement = document.getElementById('btnRoll');
            let dieElement = document.getElementById('centralDie');
            
            btnElement.disabled = true;
            btnElement.innerText = "CALCULATING ENTROPY...";

            // Strip previous state classes
            dieElement.classList.remove('crit-success', 'crit-fail');

            // Retrieve Inputs
            let diceSides = parseInt(document.getElementById('diceTypeSelect').value, 10);
            let rawQuantity = parseInt(document.getElementById('diceQuantity').value, 10);
            let diceModifier = parseInt(document.getElementById('diceModifier').value, 10);

            if (isNaN(diceModifier) === true) { diceModifier = 0; }
            if (isNaN(rawQuantity) === true || rawQuantity < 1) { rawQuantity = 1; }
            if (rawQuantity > 10) { rawQuantity = 10; }

            if (currentRollMode === "ADVANTAGE" || currentRollMode === "DISADVANTAGE") {
                rawQuantity = 2; // Force 2 dice for adv/dis
            }

            // Phase 1: Kinetic Visual Scramble
            let scrambleTicks = 0;
            let maxScrambleTicks = 20; // 1 second total at 50ms intervals
            
            scrambleIntervalObj = setInterval(function() {
                // Generate fake visual numbers
                let fakeNum = Math.floor(Math.random() * diceSides) + 1;
                dieElement.innerText = String(fakeNum);

                // Chaotic CSS 3D Rotation
                let rotX = Math.floor(Math.random() * 360);
                let rotY = Math.floor(Math.random() * 360);
                let rotZ = Math.floor(Math.random() * 360);
                dieElement.style.transform = "rotate3d(1, 1, 1, " + String(rotX) + "deg) scale(1.1)";

                scrambleTicks = scrambleTicks + 1;
                if (scrambleTicks >= maxScrambleTicks) {
                    clearInterval(scrambleIntervalObj);
                    
                    // Phase 2: Mathematical Collapse & Evaluation
                    evaluateFinalState(diceSides, rawQuantity, diceModifier);
                }
            }, 50);
        }

        function evaluateFinalState(sidesInt, qtyInt, modInt) {
            let resultsArray = [];
            let displayString = "";
            let finalSum = 0;

            let hasCritSuccess = false;
            let hasCritFail = false;

            // Generate absolute cryptography
            for (let i = 0; i < qtyInt; i = i + 1) {
                let physicalRoll = Math.floor(Math.random() * sidesInt) + 1;
                resultsArray.push(physicalRoll);

                if (sidesInt === 20) {
                    if (physicalRoll === 20) { hasCritSuccess = true; statCrits = statCrits + 1; }
                    if (physicalRoll === 1) { hasCritFail = true; statFails = statFails + 1; }
                }
            }

            // Logic Matrix Routing
            if (currentRollMode === "NORMAL") {
                
                for (let i = 0; i < resultsArray.length; i = i + 1) {
                    finalSum = finalSum + resultsArray[i];
                    displayString = displayString + "[" + String(resultsArray[i]) + "] ";
                }
                finalSum = finalSum + modInt;
                
                if (modInt > 0) { displayString = displayString + "+ " + String(modInt); }
                else if (modInt < 0) { displayString = displayString + "- " + String(Math.abs(modInt)); }

            } else if (currentRollMode === "ADVANTAGE") {
                
                let rollOne = resultsArray[0];
                let rollTwo = resultsArray[1];
                let highest = rollOne;
                let lowest = rollTwo;
                
                if (rollTwo > rollOne) { highest = rollTwo; lowest = rollOne; }

                finalSum = highest + modInt;
                displayString = "[~~" + String(lowest) + "~~] [" + String(highest) + "] ";
                
                if (modInt > 0) { displayString = displayString + "+ " + String(modInt); }
                else if (modInt < 0) { displayString = displayString + "- " + String(Math.abs(modInt)); }

                // Reset crits based on the HIGHEST roll only
                hasCritSuccess = false; hasCritFail = false;
                if (sidesInt === 20 && highest === 20) { hasCritSuccess = true; }
                if (sidesInt === 20 && highest === 1) { hasCritFail = true; }

            } else if (currentRollMode === "DISADVANTAGE") {
                
                let rollOne = resultsArray[0];
                let rollTwo = resultsArray[1];
                let highest = rollOne;
                let lowest = rollTwo;
                
                if (rollTwo > rollOne) { highest = rollTwo; lowest = rollOne; }

                finalSum = lowest + modInt;
                displayString = "[" + String(lowest) + "] [~~" + String(highest) + "~~] ";
                
                if (modInt > 0) { displayString = displayString + "+ " + String(modInt); }
                else if (modInt < 0) { displayString = displayString + "- " + String(Math.abs(modInt)); }

                // Reset crits based on the LOWEST roll only
                hasCritSuccess = false; hasCritFail = false;
                if (sidesInt === 20 && lowest === 20) { hasCritSuccess = true; }
                if (sidesInt === 20 && lowest === 1) { hasCritFail = true; }
            }

            // Phase 3: Physical DOM Update
            let dieElement = document.getElementById('centralDie');
            let themeColors = getThemeColors();

            // Set main die to display the final calculated sum (without modifiers) for visual impact, or first die if multi
            if (qtyInt === 1) {
                dieElement.innerText = String(resultsArray[0]);
            } else {
                dieElement.innerText = "Σ"; // Sigma symbol to indicate a sum array
            }
            
            // Snap rotation to flat
            dieElement.style.transform = "rotate3d(1, 1, 1, 0deg) scale(1)";

            if (hasCritSuccess === true) {
                dieElement.classList.add('crit-success');
                detonateParticles(themeColors.critSuccess);
            } else if (hasCritFail === true) {
                dieElement.classList.add('crit-fail');
                detonateParticles(themeColors.critFail);
            } else {
                detonateParticles(themeColors.accent);
            }

            statTotalRolls = statTotalRolls + 1;
            updateTelemetryHUD();

            // Build Ledger Header
            let headerStr = String(qtyInt) + "d" + String(sidesInt);
            if (currentRollMode !== "NORMAL") {
                headerStr = headerStr + " (" + currentRollMode + ")";
            }

            logToLedger(headerStr, displayString, finalSum, hasCritSuccess, hasCritFail);

            // Release Lock
            let btnElement = document.getElementById('btnRoll');
            btnElement.disabled = false;
            btnElement.innerHTML = "<i class='fas fa-dice-d20 me-2'></i> Execute Roll";
            isEngineLocked = false;
        }

    </script>
</body>
</html>
