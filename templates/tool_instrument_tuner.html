<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instrument Tuner | Tool</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #20c997;
            --surface: #ffffff;
            --background: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --danger: #dc3545;
            --warning: #fd7e14;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            padding: 2rem;
            line-height: 1.5;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header { margin-bottom: 2rem; }
        .back-link { color: #2563eb; text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 0.5rem; }
        
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 3rem 2rem;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
            text-align: center;
        }

        .note-display {
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            color: var(--primary);
            margin-bottom: 0;
            position: relative;
            display: inline-block;
        }

        .sharp-flat {
            font-size: 3rem;
            position: absolute;
            top: 10px;
            right: -35px;
            color: var(--text-muted);
        }

        .hz-display {
            font-size: 1.5rem;
            color: var(--text-muted);
            font-family: monospace;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        .meter-container {
            position: relative;
            width: 100%;
            height: 40px;
            background: #e2e8f0;
            border-radius: 20px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .meter-center {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: var(--primary);
            transform: translateX(-50%);
            z-index: 2;
        }

        .meter-pointer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 10px;
            background: var(--danger);
            border-radius: 5px;
            transform: translateX(-50%);
            transition: left 0.1s ease-out, background-color 0.2s;
            z-index: 3;
        }

        .tuning-status {
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2rem;
            height: 24px;
        }

        .btn {
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            background: var(--primary);
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            justify-content: center;
        }

        .btn:hover { background: #334155; }
        .btn.active { background: var(--danger); }
        .btn.active:hover { background: #bb2d3b; }

        .error-msg { color: var(--danger); font-weight: 600; margin-top: 1rem; display: none; }

    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="app-container">
    <div class="header">
        <a href="{{ url_for('student_portal') }}" class="back-link">← Back To Dashboard</a>
    </div>

    <div class="card">
        <div class="tuning-status" id="tuningStatus" style="color: var(--text-muted);">STANDBY</div>

        <div class="note-display">
            <span id="noteName">-</span>
            <span class="sharp-flat" id="noteModifier"></span>
        </div>

        <div class="hz-display"><span id="hzValue">0.00</span> Hz</div>

        <div class="meter-container">
            <div class="meter-center"></div>
            <div class="meter-pointer" id="meterPointer"></div>
        </div>

        <button class="btn" id="toggleBtn">
            <i class="fas fa-microphone"></i> <span id="btnText">ACTIVATE TUNER</span>
        </button>

        <div class="error-msg" id="errorMsg">Microphone access denied.</div>
    </div>
</div>

<script>
    /**
     * Precision Autocorrelation Tuner Engine
     */
    class InstrumentTuner {
        constructor() {
            this.toggleBtn = document.getElementById('toggleBtn');
            this.btnText = document.getElementById('btnText');
            this.noteName = document.getElementById('noteName');
            this.noteModifier = document.getElementById('noteModifier');
            this.hzValue = document.getElementById('hzValue');
            this.meterPointer = document.getElementById('meterPointer');
            this.tuningStatus = document.getElementById('tuningStatus');
            this.errorMsg = document.getElementById('errorMsg');

            this.audioCtx = null;
            this.analyser = null;
            this.mediaStreamSource = null;
            this.isActive = false;
            this.animationId = null;

            // Musical Data
            this.noteStrings = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            
            this.initBindings();
        }

        initBindings() {
            this.toggleBtn.addEventListener('click', () => this.toggleTuner());
        }

        async toggleTuner() {
            if (this.isActive) {
                this.stopTuner();
            } else {
                await this.startTuner();
            }
        }

        async startTuner() {
            try {
                this.errorMsg.style.display = 'none';
                
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                this.analyser = this.audioCtx.createAnalyser();
                this.analyser.fftSize = 2048;
                
                this.mediaStreamSource = this.audioCtx.createMediaStreamSource(stream);
                this.mediaStreamSource.connect(this.analyser);

                this.isActive = true;
                this.toggleBtn.classList.add('active');
                this.btnText.textContent = "STOP TUNER";
                this.toggleBtn.innerHTML = '<i class="fas fa-stop"></i> <span id="btnText">STOP TUNER</span>';

                this.updatePitch();
            } catch (err) {
                console.error("Audio Access Error:", err);
                this.errorMsg.style.display = 'block';
            }
        }

        stopTuner() {
            this.isActive = false;
            if (this.mediaStreamSource) this.mediaStreamSource.disconnect();
            if (this.animationId) cancelAnimationFrame(this.animationId);
            
            this.toggleBtn.classList.remove('active');
            this.toggleBtn.innerHTML = '<i class="fas fa-microphone"></i> <span id="btnText">ACTIVATE TUNER</span>';
            
            // Reset UI
            this.noteName.textContent = "-";
            this.noteModifier.textContent = "";
            this.hzValue.textContent = "0.00";
            this.meterPointer.style.left = '50%';
            this.meterPointer.style.backgroundColor = 'var(--danger)';
            this.tuningStatus.textContent = "STANDBY";
            this.tuningStatus.style.color = 'var(--text-muted)';
        }

        // Standard formula to convert Hz to MIDI note number
        noteFromPitch(frequency) {
            const noteNum = 12 * (Math.log(frequency / 440) / Math.log(2));
            return Math.round(noteNum) + 69;
        }

        // Get exact frequency of a MIDI note
        frequencyFromNoteNumber(note) {
            return 440 * Math.pow(2, (note - 69) / 12);
        }

        // Calculate how many cents off pitch the frequency is (-50 to +50)
        centsOffFromPitch(frequency, note) {
            return Math.floor(1200 * Math.log(frequency / this.frequencyFromNoteNumber(note)) / Math.log(2));
        }

        /**
         * Autocorrelation Algorithm
         * Highly accurate method for determining pitch from a raw waveform.
         */
        autoCorrelate(buf, sampleRate) {
            let SIZE = buf.length;
            let rms = 0;

            // Calculate Root Mean Square to detect volume level
            for (let i = 0; i < SIZE; i++) {
                let val = buf[i];
                rms += val * val;
            }
            rms = Math.sqrt(rms / SIZE);
            if (rms < 0.01) return -1; // Not enough signal (silence)

            // Find a range in the buffer where the values are non-zero
            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) {
                if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            }
            for (let i = 1; i < SIZE / 2; i++) {
                if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
            }

            buf = buf.slice(r1, r2);
            SIZE = buf.length;

            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE - i; j++) {
                    c[i] = c[i] + buf[j] * buf[j + i];
                }
            }

            let d = 0; 
            while (c[d] > c[d + 1]) d++;
            
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) {
                    maxval = c[i];
                    maxpos = i;
                }
            }
            
            let T0 = maxpos;

            // Interpolation for finer accuracy
            let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
            let a = (x1 + x3 - 2 * x2) / 2;
            let b = (x3 - x1) / 2;
            if (a) T0 = T0 - b / (2 * a);

            return sampleRate / T0;
        }

        updatePitch() {
            if (!this.isActive) return;

            const buffer = new Float32Array(this.analyser.fftSize);
            this.analyser.getFloatTimeDomainData(buffer);
            
            const ac = this.autoCorrelate(buffer, this.audioCtx.sampleRate);

            if (ac !== -1 && ac !== undefined) {
                const pitch = ac;
                this.hzValue.textContent = Math.round(pitch * 10) / 10;
                
                const note = this.noteFromPitch(pitch);
                const noteString = this.noteStrings[note % 12];
                
                // Parse Note and Sharp/Flat modifier
                if (noteString.length > 1) {
                    this.noteName.textContent = noteString.charAt(0);
                    this.noteModifier.textContent = noteString.charAt(1);
                } else {
                    this.noteName.textContent = noteString;
                    this.noteModifier.textContent = "";
                }

                // Calculate Cents and update Meter
                const cents = this.centsOffFromPitch(pitch, note);
                
                // Map cents (-50 to 50) to percentage (0% to 100%)
                const percentage = (cents + 50); 
                this.meterPointer.style.left = `${percentage}%`;

                // Update Status Text and Colors based on accuracy
                if (Math.abs(cents) <= 3) {
                    this.tuningStatus.textContent = "IN TUNE";
                    this.tuningStatus.style.color = "var(--accent)";
                    this.meterPointer.style.backgroundColor = "var(--accent)";
                    this.noteName.style.color = "var(--accent)";
                } else if (cents < 0) {
                    this.tuningStatus.textContent = "FLAT (TOO LOW)";
                    this.tuningStatus.style.color = "var(--warning)";
                    this.meterPointer.style.backgroundColor = "var(--warning)";
                    this.noteName.style.color = "var(--primary)";
                } else {
                    this.tuningStatus.textContent = "SHARP (TOO HIGH)";
                    this.tuningStatus.style.color = "var(--danger)";
                    this.meterPointer.style.backgroundColor = "var(--danger)";
                    this.noteName.style.color = "var(--primary)";
                }
            } else {
                // Dim the UI slightly when silence is detected
                this.tuningStatus.textContent = "LISTENING...";
                this.tuningStatus.style.color = "var(--text-muted)";
                this.noteName.style.color = "var(--primary)";
            }

            this.animationId = requestAnimationFrame(() => this.updatePitch());
        }
    }

    document.addEventListener('DOMContentLoaded', () => new InstrumentTuner());
</script>

</body>
</html>
