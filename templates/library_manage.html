<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand">📚 Library Manager</span>
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-light btn-sm">Back to Dashboard</a>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white fw-bold">Add New Book</div>
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label">Book Title</label>
                            <input type="text" name="title" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Author</label>
                            <input type="text" name="author" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Stock Quantity (Physical)</label>
                            <input type="number" name="stock" class="form-control" value="5" min="0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Cover Image (Optional)</label>
                            <input type="file" name="cover" class="form-control" accept="image/*">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Upload PDF E-Book (Optional)</label>
                            <input type="file" name="pdf" class="form-control" accept="application/pdf">
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold">Add to Library</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white fw-bold">Current Catalogue</div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Cover</th>
                                <th>Details</th>
                                <th>Stock</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for book in books %}
                            <tr>
                                <td>
                                    <img src="{{ url_for('static', filename='library/covers/' + book.cover_image) }}" style="width: 50px; height: 70px; object-fit: cover; border-radius: 4px;">
                                </td>
                                <td>
                                    <div class="fw-bold">{{ book.title }}</div>
                                    <div class="text-muted small">{{ book.author }}</div>
                                    {% if book.pdf_file %}
                                        <span class="badge bg-info text-dark">PDF Available</span>
                                    {% endif %}
                                </td>
                                <td>{{ book.stock_quantity }}</td>
                                <td>
                                    <form action="{{ url_for('delete_book', id=book.id) }}" method="POST" onsubmit="return confirm('Remove this book?');">
                                        <button class="btn btn-sm btn-outline-danger">🗑️</button>
                                    </form>
                                </td>
                            </tr>
                            {% else %}
                            <tr><td colspan="4" class="text-center py-4 text-muted">Library is empty.</td></tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
