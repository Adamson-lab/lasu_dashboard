<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V1000 Lunar Astrolabe | L.I.S.A. Utilities</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* ==========================================
           V1000 CELESTIAL THEME ENGINE
           ========================================== */
        
        [data-theme="dark"] {
            --astro-bg: #09090e;
            --astro-surface: #11111a;
            --astro-text: #e2e8f0;
            --astro-text-muted: #8b8b9c;
            --astro-accent: #a5b4fc; /* Soft Indigo */
            --astro-gold: #fde047;
            --astro-border: #242433;
            --moon-light: #ffffff;
            --moon-dark: #1e1e2d;
            --shadow-halo: 0 0 50px rgba(165, 180, 252, 0.15);
        }

        [data-theme="light"] {
            --astro-bg: #f8fafc;
            --astro-surface: #ffffff;
            --astro-text: #1e293b;
            --astro-text-muted: #64748b;
            --astro-accent: #4f46e5;
            --astro-gold: #d97706;
            --astro-border: #e2e8f0;
            --moon-light: #f1f5f9;
            --moon-dark: #94a3b8;
            --shadow-halo: 0 10px 40px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Baskerville', 'Georgia', serif;
            background-color: var(--astro-bg);
            color: var(--astro-text);
            transition: all 0.5s ease;
            margin: 0;
            padding: 40px 20px;
        }

        .tool-container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: var(--astro-surface);
            border: 1px solid var(--astro-border);
            border-radius: 20px;
            padding: 50px;
            box-shadow: var(--shadow-halo);
        }

        /* Header */
        .astro-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--astro-border);
            padding-bottom: 30px;
            margin-bottom: 50px;
            text-align: center;
        }

        .header-center {
            flex-grow: 1;
        }

        .astro-title {
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0;
        }

        .astro-subtitle {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: var(--astro-accent);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .btn-nav {
            background: transparent;
            color: var(--astro-text);
            border: 1px solid var(--astro-border);
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
        }

        .btn-nav:hover {
            border-color: var(--astro-accent);
            color: var(--astro-accent);
        }

        /* Input Controls */
        .input-dock {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 50px;
        }

        .date-input {
            background-color: transparent;
            border: none;
            border-bottom: 2px solid var(--astro-border);
            color: var(--astro-text);
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            padding: 10px;
            outline: none;
            text-align: center;
            transition: border-color 0.3s;
        }
        .date-input:focus {
            border-bottom-color: var(--astro-gold);
        }
        ::-webkit-calendar-picker-indicator { cursor: pointer; }
        [data-theme="dark"] ::-webkit-calendar-picker-indicator { filter: invert(1); }

        .btn-execute {
            background-color: transparent;
            color: var(--astro-gold);
            border: 1px solid var(--astro-gold);
            padding: 12px 30px;
            border-radius: 50px;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-execute:hover {
            background-color: var(--astro-gold);
            color: var(--astro-bg);
            box-shadow: 0 0 20px rgba(253, 224, 71, 0.2);
        }

        /* Main Astrolabe Stage */
        .astrolabe-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 50px;
        }

        /* Physical CSS Moon Rendering */
        .moon-sphere {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background-color: var(--moon-dark);
            position: relative;
            overflow: hidden;
            box-shadow: inset -20px 0 40px rgba(0,0,0,0.5), 0 0 50px rgba(255,255,255,0.05);
            border: 1px solid var(--astro-border);
        }

        .moon-light-hemisphere {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background-color: var(--moon-light);
        }

        .moon-shadow-mask {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .phase-title {
            font-size: 2.5rem;
            font-style: italic;
            margin-top: 40px;
            margin-bottom: 10px;
            color: var(--astro-text);
        }

        /* Data Grid */
        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            border-top: 1px solid var(--astro-border);
            padding-top: 40px;
        }

        .telemetry-node {
            text-align: center;
        }

        .node-label {
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: var(--astro-text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .node-value {
            font-size: 1.8rem;
            font-weight: 400;
            color: var(--astro-accent);
        }

        .node-sub {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: var(--astro-text-muted);
            margin-top: 5px;
        }

    </style>
</head>
<body>

    <div class="tool-container">
        
        <div class="astro-header">
            <a href="{{ url_for('student_tools_dashboard') }}" class="btn-nav">
                <i class="fas fa-chevron-left me-2"></i> Retreat
            </a>
            
            <div class="header-center">
                <h1 class="astro-title">Lunar Astrolabe</h1>
                <div class="astro-subtitle">Synodic Cycle Mathematics</div>
            </div>

            <button class="btn-nav" onclick="toggleCelestialTheme()">
                <i class="fas fa-adjust"></i>
            </button>
        </div>

        <div class="input-dock">
            <input type="date" id="targetDateInput" class="date-input">
            <button class="btn-execute" onclick="executeSynodicCalculations()">Align Astrolabe</button>
        </div>

        <div class="astrolabe-stage">
            
            <div class="moon-sphere" id="moonOrb">
                <div class="moon-light-hemisphere" id="moonBaseLight"></div>
                <div class="moon-shadow-mask" id="moonMask"></div>
            </div>

            <div class="phase-title" id="phaseNameOutput">Awaiting Coordinates</div>

        </div>

        <div class="telemetry-grid">
            <div class="telemetry-node">
                <div class="node-label">Solar Illumination</div>
                <div class="node-value" id="illuminationOutput">0.00%</div>
                <div class="node-sub">Visible Surface Area</div>
            </div>
            
            <div class="telemetry-node">
                <div class="node-label">Synodic Progress</div>
                <div class="node-value" id="ageDaysOutput">0.00</div>
                <div class="node-sub">Days Since New Moon</div>
            </div>

            <div class="telemetry-node">
                <div class="node-label">Phase Fraction</div>
                <div class="node-value" id="fractionOutput">0.0000</div>
                <div class="node-sub">Orbital Position (0 - 1)</div>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // V1000 CELESTIAL THEME ENGINE
        // ==========================================
        function toggleCelestialTheme() {
            let htmlElement = document.documentElement;
            let currentTheme = htmlElement.getAttribute('data-theme');
            let nextTheme;

            if (currentTheme === "light") {
                nextTheme = "dark";
            } else {
                nextTheme = "light";
            }

            htmlElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('lisa_v1000_astro', nextTheme);
        }

        document.addEventListener("DOMContentLoaded", function() {
            let savedTheme = localStorage.getItem('lisa_v1000_astro');
            
            if (savedTheme !== null) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }

            // Set default input to today
            let currentDateObject = new Date();
            let yearString = String(currentDateObject.getFullYear());
            let monthString = String(currentDateObject.getMonth() + 1);
            let dayString = String(currentDateObject.getDate());

            if (monthString.length === 1) { monthString = "0" + monthString; }
            if (dayString.length === 1) { dayString = "0" + dayString; }

            document.getElementById('targetDateInput').value = yearString + "-" + monthString + "-" + dayString;

            // Execute initial calculation
            executeSynodicCalculations();
        });

        // ==========================================
        // V1000 SYNODIC MATHEMATICS
        // ==========================================
        
        function calculateJulianDay(yearValue, monthValue, dayValue) {
            let adjustedYear = yearValue;
            let adjustedMonth = monthValue;

            if (adjustedMonth < 3) {
                adjustedYear = adjustedYear - 1;
                adjustedMonth = adjustedMonth + 12;
            }

            let centuryTerm = Math.floor(adjustedYear / 100);
            let leapCenturyTerm = Math.floor(centuryTerm / 4);
            let gregorianCorrection = 2 - centuryTerm + leapCenturyTerm;
            
            let yearTerm = Math.floor(365.25 * (adjustedYear + 4716));
            let monthTerm = Math.floor(30.6001 * (adjustedMonth + 1));

            let calculatedJulianDate = gregorianCorrection + dayValue + yearTerm + monthTerm - 1524.5;
            
            return calculatedJulianDate;
        }

        function calculateMoonPhase(targetDateObject) {
            let year = targetDateObject.getFullYear();
            let month = targetDateObject.getMonth() + 1;
            let day = targetDateObject.getDate();

            let targetJulianDate = calculateJulianDay(year, month, day);
            
            // Known Epoch: January 6, 2000 was a New Moon (Approx Julian Date 2451549.5)
            let newMoonEpochJulian = 2451549.5;
            
            // The exact length of a Synodic Month (Lunar Cycle)
            let synodicMonthDays = 29.53058867;

            let daysSinceEpoch = targetJulianDate - newMoonEpochJulian;
            let totalCyclesElapsed = daysSinceEpoch / synodicMonthDays;
            
            // The fractional part represents exactly where we are in the current cycle (0.0 to 1.0)
            let currentPhaseFraction = totalCyclesElapsed - Math.floor(totalCyclesElapsed);

            if (currentPhaseFraction < 0) {
                currentPhaseFraction = currentPhaseFraction + 1;
            }

            let ageInDays = currentPhaseFraction * synodicMonthDays;

            // Calculate Illumination Percentage
            let illuminationPercentage;
            if (currentPhaseFraction <= 0.5) {
                // Waxing: 0 to 100%
                illuminationPercentage = (currentPhaseFraction / 0.5) * 100;
            } else {
                // Waning: 100% to 0%
                illuminationPercentage = ((1.0 - currentPhaseFraction) / 0.5) * 100;
            }

            return {
                fraction: currentPhaseFraction,
                age: ageInDays,
                illumination: illuminationPercentage
            };
        }

        function getPhaseName(fractionalValue) {
            // Establish boundary tolerances for the primary phases
            if (fractionalValue < 0.02 || fractionalValue > 0.98) {
                return "New Moon";
            } else if (fractionalValue >= 0.02 && fractionalValue < 0.23) {
                return "Waxing Crescent";
            } else if (fractionalValue >= 0.23 && fractionalValue < 0.27) {
                return "First Quarter";
            } else if (fractionalValue >= 0.27 && fractionalValue < 0.48) {
                return "Waxing Gibbous";
            } else if (fractionalValue >= 0.48 && fractionalValue < 0.52) {
                return "Full Moon";
            } else if (fractionalValue >= 0.52 && fractionalValue < 0.73) {
                return "Waning Gibbous";
            } else if (fractionalValue >= 0.73 && fractionalValue < 0.77) {
                return "Last Quarter";
            } else {
                return "Waning Crescent";
            }
        }

        // ==========================================
        // DYNAMIC DOM & CSS PHYSICS RENDERING
        // ==========================================
        
        function renderVisualMoon(fractionalValue) {
            let baseLightElement = document.getElementById('moonBaseLight');
            let maskElement = document.getElementById('moonMask');

            let lightColor = "var(--moon-light)";
            let darkColor = "var(--moon-dark)";

            // Step 1: Base hemisphere positioning
            if (fractionalValue <= 0.5) {
                // Waxing (Right side illuminates)
                baseLightElement.style.left = "50%";
                baseLightElement.style.right = "auto";
                baseLightElement.style.backgroundColor = lightColor;
            } else {
                // Waning (Left side illuminates)
                baseLightElement.style.left = "0";
                baseLightElement.style.right = "auto";
                baseLightElement.style.backgroundColor = lightColor;
            }

            // Step 2: Mask scaling logic to create the crescent/gibbous curves
            if (fractionalValue < 0.25) {
                // Waxing Crescent: Dark mask covers right side, shrinking
                let scaleX = 1 - (fractionalValue / 0.25);
                maskElement.style.backgroundColor = darkColor;
                maskElement.style.transform = "scaleX(" + String(scaleX) + ")";
                maskElement.style.left = "0"; // Centered scaling
            } else if (fractionalValue >= 0.25 && fractionalValue <= 0.5) {
                // Waxing Gibbous: Light mask expands over left side
                let scaleX = (fractionalValue - 0.25) / 0.25;
                maskElement.style.backgroundColor = lightColor;
                maskElement.style.transform = "scaleX(" + String(scaleX) + ")";
                maskElement.style.left = "0";
            } else if (fractionalValue > 0.5 && fractionalValue < 0.75) {
                // Waning Gibbous: Light mask shrinks over right side
                let scaleX = 1 - ((fractionalValue - 0.5) / 0.25);
                maskElement.style.backgroundColor = lightColor;
                maskElement.style.transform = "scaleX(" + String(scaleX) + ")";
                maskElement.style.left = "0";
            } else {
                // Waning Crescent: Dark mask expands over left side
                let scaleX = (fractionalValue - 0.75) / 0.25;
                maskElement.style.backgroundColor = darkColor;
                maskElement.style.transform = "scaleX(" + String(scaleX) + ")";
                maskElement.style.left = "0";
            }
        }

        function executeSynodicCalculations() {
            let dateInputValue = document.getElementById('targetDateInput').value;
            
            if (dateInputValue === "") {
                alert("CRITICAL ERROR: A valid date coordinate is required.");
                return;
            }

            let datePartsArray = dateInputValue.split("-");
            let parsedYear = parseInt(datePartsArray[0], 10);
            let parsedMonth = parseInt(datePartsArray[1], 10) - 1; 
            let parsedDay = parseInt(datePartsArray[2], 10);

            // Create object at Noon to avoid timezone offset boundaries
            let targetDateObject = new Date(parsedYear, parsedMonth, parsedDay, 12, 0, 0);

            let lunarData = calculateMoonPhase(targetDateObject);
            let phaseString = getPhaseName(lunarData.fraction);

            // Update Text Readouts
            document.getElementById('phaseNameOutput').innerText = phaseString;
            
            let illFormatter = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById('illuminationOutput').innerText = illFormatter.format(lunarData.illumination) + "%";
            
            let ageFormatter = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById('ageDaysOutput').innerText = ageFormatter.format(lunarData.age);
            
            let fracFormatter = new Intl.NumberFormat('en-US', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
            document.getElementById('fractionOutput').innerText = fracFormatter.format(lunarData.fraction);

            // Update Visual Sphere
            renderVisualMoon(lunarData.fraction);
        }

    </script>
</body>
</html>
