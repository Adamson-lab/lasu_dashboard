<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Target GP Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0">
                <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between">
                    <span>🎯 Target GP Calculator</span>
                    <a href="{{ url_for('student_portal') }}" class="btn btn-sm btn-outline-light">Back</a>
                </div>
                <div class="card-body">
                    
                    {% if result %}
                    <div class="alert alert-{{ color }} text-center shadow-sm">
                        <h6 class="fw-bold mb-1">{{ result }}</h6>
                        {% if required_gpa and required_gpa <= 5.0 %}
                            <h1 class="display-3 fw-bold my-2">{{ required_gpa }}</h1>
                            <small>Required GPA this semester</small>
                        {% endif %}
                    </div>
                    {% endif %}

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">CURRENT CGPA</label>
                            <input type="number" step="0.01" name="current_cgpa" class="form-control form-control-lg" placeholder="e.g. 3.45" required>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold text-muted">UNITS TAKEN</label>
                                <input type="number" name="units_taken" class="form-control" placeholder="e.g. 42" required>
                                <div class="form-text" style="font-size: 0.7rem">Total units passed so far</div>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold text-muted">UPCOMING UNITS</label>
                                <input type="number" name="next_units" class="form-control" placeholder="e.g. 18" required>
                                <div class="form-text" style="font-size: 0.7rem">Units you plan to register</div>
                            </div>
                        </div>

                        <hr>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-success">TARGET CGPA GOAL</label>
                            <input type="number" step="0.01" name="target_cgpa" class="form-control border-success border-2" placeholder="e.g. 4.50" required>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 fw-bold py-2">🚀 Calculate Requirement</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
