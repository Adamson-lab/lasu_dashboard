<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - LASU Analytics</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           V70 MASTER THEME ENGINE (CLEAN AUTH)
           ========================================== */
        
        [data-theme="light"] {
            --bg-master: #f8fafc;
            --bg-surface: #ffffff;
            --border-core: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --grid-line: rgba(0, 0, 0, 0.03);
            --shadow-core: 0 15px 35px rgba(0, 0, 0, 0.05);
            --primary-blue: #0ea5e9;
            --primary-hover: #0284c7;
        }

        body {
            font-family: 'Inter', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-master);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .auth-card {
            width: 100%;
            max-width: 600px; /* Widened for spacious feel */
            background: var(--bg-surface);
            border: 1px solid var(--border-core);
            border-radius: 16px;
            padding: 60px 50px; /* Massively increased internal padding to push content outwards */
            box-shadow: var(--shadow-core);
            text-align: center;
            margin: 20px;
        }

        .auth-icon {
            width: 70px;
            height: 70px;
            background: rgba(14, 165, 233, 0.1);
            color: var(--primary-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 25px auto;
            border: 1px solid rgba(14, 165, 233, 0.2);
        }

        .auth-title {
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--text-main);
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .auth-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 35px;
            line-height: 1.6;
            padding: 0 10px; /* Added slight padding to keep text from touching edges */
        }

        .form-control-v70 {
            background: var(--bg-master);
            border: 2px solid var(--border-core);
            color: var(--text-main);
            padding: 14px 15px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .form-control-v70:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
            outline: none;
            background: var(--bg-surface);
        }

        .btn-primary-v70 {
            background: var(--primary-blue);
            color: #ffffff;
            border: none;
            font-weight: 700;
            padding: 14px 20px;
            border-radius: 8px;
            letter-spacing: 0.5px;
            transition: all 0.2s;
            width: 100%;
            font-size: 1.05rem;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        .btn-primary-v70:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(14, 165, 233, 0.3);
        }

        .abort-link {
            display: inline-block;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .abort-link:hover {
            color: var(--text-main);
        }
    </style>

    <link rel="icon" type="image/jpeg" sizes="32x32" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
    <link rel="icon" type="image/jpeg" sizes="16x16" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
</head>
<body>

    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="{{ url_for('static', filename='lasu_logo.jpg') }}" alt="LASU Logo" style="width: 75px; height: auto;">
        </div>
        
        <h3 class="auth-title">Trouble Logging In?</h3>
        <p class="auth-subtitle">Enter your registered email and we'll send you a link to get back into your account.</p>
        
        <form method="POST">
            <div class="text-start mb-3">
                <label class="form-label fw-bold text-muted small text-uppercase">Email Address</label>
                <input type="email" name="email" class="form-control form-control-v70" placeholder="e.g. lecturer@lasu.edu.ng" required autofocus>
            </div>
            
            <button type="submit" class="btn-primary-v70" id="submitBtn">
    <span id="btnText"><i class="fas fa-paper-plane me-2"></i> Send Reset Link</span>
    <span id="btnSpinner" class="d-none">
        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        Transmitting...
    </span>
</button>

<script>
    // 🟢 ARCHITECT FIX: Prevent multiple clicks and show activity
    document.querySelector('form').onsubmit = function() {
        const btn = document.getElementById('submitBtn');
        const text = document.getElementById('btnText');
        const spinner = document.getElementById('btnSpinner');
        
        btn.disabled = true; // Block double-clicks
        text.classList.add('d-none');
        spinner.classList.remove('d-none');
    };
</script>
        </form>
        
        <div class="text-center mt-2">
            <a href="{{ url_for('login') }}" class="abort-link">
                <i class="fas fa-arrow-left me-1"></i> Back to Login
            </a>
        </div>
    </div>

</body>
</html>
