<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Telemedicine | LASU Health Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #202124; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        /* Main Layout */
        .telemed-container { display: flex; height: 100vh; width: 100%; }
        
        /* Video Area */
        .video-area { 
            flex: 1; 
            position: relative; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #000; 
        }
        
        /* Doctor's Video (Main) */
        .main-video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            opacity: 0.5; /* Dimmed until connected */
            transition: opacity 1s;
        }
        
        /* Student's Video (PiP) */
        .local-video { 
            position: absolute; 
            bottom: 30px; 
            right: 30px; 
            width: 280px; 
            height: 160px; 
            background: #333; 
            border-radius: 12px; 
            border: 2px solid rgba(255,255,255,0.2); 
            object-fit: cover; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* Controls Bar */
        .controls-bar { 
            position: absolute; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            gap: 15px; 
            background: rgba(40, 44, 52, 0.9); 
            padding: 15px 30px; 
            border-radius: 50px; 
            backdrop-filter: blur(10px);
            z-index: 20;
        }
        
        .btn-control { 
            width: 50px; 
            height: 50px; 
            border-radius: 50%; 
            border: none; 
            color: white; 
            font-size: 1.2rem; 
            transition: 0.2s; 
            background: #3c4043;
        }
        .btn-control:hover { background: #5f6368; transform: scale(1.1); }
        .btn-end { background: #ea4335; }
        .btn-end:hover { background: #d93025; }
        
        /* Sidebar (Chat/Info) */
        .info-sidebar { 
            width: 350px; 
            background: #fff; 
            display: flex; 
            flex-direction: column; 
            border-left: 1px solid #444;
        }
        .doctor-profile { padding: 30px; text-align: center; border-bottom: 1px solid #eee; background: #f8f9fa; }
        .doc-avatar { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 10px; border: 3px solid #198754; object-fit: cover; }
        
        .chat-area { flex: 1; padding: 20px; overflow-y: auto; background: #fff; }
        .chat-bubble { padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; max-width: 85%; font-size: 0.9rem; }
        .bubble-doc { background: #f1f3f4; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        .bubble-me { background: #e3f2fd; color: #0d6efd; align-self: flex-end; margin-left: auto; border-bottom-right-radius: 2px; }

        /* Connection Status Overlay */
        .status-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 5;
        }
        .pulse-ring {
            width: 80px; height: 80px;
            border-radius: 50%;
            border: 4px solid #198754;
            animation: pulse 2s infinite;
            margin: 0 auto 20px auto;
            display: flex; align-items: center; justify-content: center;
        }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(25, 135, 84, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(25, 135, 84, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(25, 135, 84, 0); } }
    </style>

    
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
</head>
<body>

<div class="telemed-container">
    <div class="video-area">
        <img src="https://media.istockphoto.com/id/1325356950/video/portrait-of-caucasian-male-doctor-listening-to-patient-during-telemedicine-videocall.jpg?s=640x640&k=20&c=OZtMvUjV8FvCg_-lV0t9zJ0X9Xz_v8v_8v_8v_8v_8v=" 
             class="main-video" id="remoteVideo" alt="Doctor Feed">
        
        <video id="localVideo" class="local-video" autoplay muted playsinline></video>

        <div class="status-overlay" id="connectStatus">
            <div class="pulse-ring"><i class="fas fa-user-md fa-2x text-success"></i></div>
            <h4 class="fw-bold">Connecting to Dr. Ademola...</h4>
            <p class="text-white-50">Establishing secure encryption</p>
        </div>

        <div class="controls-bar">
            <button class="btn-control" onclick="toggleMic()" title="Mute"><i class="fas fa-microphone" id="micIcon"></i></button>
            <button class="btn-control" onclick="toggleCam()" title="Camera"><i class="fas fa-video" id="camIcon"></i></button>
            <button class="btn-control btn-end" onclick="endCall()" title="End Call"><i class="fas fa-phone-slash"></i></button>
        </div>
    </div>

    <div class="info-sidebar d-none d-md-flex">
        <div class="doctor-profile">
            <img src="https://ui-avatars.com/api/?name=Dr+Ademola&background=198754&color=fff" class="doc-avatar">
            <h5 class="fw-bold mb-1">Dr. Ademola T.</h5>
            <small class="text-success fw-bold"><i class="fas fa-circle me-1" style="font-size: 8px;"></i> LIVE CONSULTATION</small>
            <p class="text-muted small mt-2">General Practitioner • LASU Health Center</p>
        </div>

        <div class="chat-area" id="chatBox">
            <div class="text-center text-muted small mb-3">Session Started: 10:42 AM</div>
            <div class="chat-bubble bubble-doc">
                Hello {{ student.name }}! I can see you now. How are you feeling today?
            </div>
        </div>

        <div class="p-3 border-top bg-light">
            <div class="input-group">
                <input type="text" class="form-control border-0" placeholder="Type a message..." id="chatInput">
                <button class="btn btn-primary rounded-circle ms-2" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. Access Webcam
    const localVideo = document.getElementById('localVideo');
    const connectStatus = document.getElementById('connectStatus');
    const remoteVideo = document.getElementById('remoteVideo');

    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(stream => {
            localVideo.srcObject = stream;
            // Simulate connection delay
            setTimeout(() => {
                connectStatus.style.display = 'none';
                remoteVideo.style.opacity = '1';
                speak("Hello! I am Doctor Ademola. I can see you clearly. How can I help you?");
            }, 3000);
        })
        .catch(err => {
            alert("Camera access denied. Please enable permissions.");
        });

    // 2. Control Logic
    let isMuted = false;
    let isCamOff = false;

    function toggleMic() {
        isMuted = !isMuted;
        document.getElementById('micIcon').className = isMuted ? "fas fa-microphone-slash" : "fas fa-microphone";
        // Logic to actually mute stream would go here
    }

    function toggleCam() {
        isCamOff = !isCamOff;
        document.getElementById('camIcon').className = isCamOff ? "fas fa-video-slash" : "fas fa-video";
        localVideo.style.opacity = isCamOff ? "0" : "1";
    }

    function endCall() {
        if(confirm("End consultation?")) {
            window.location.href = "{{ url_for('student_portal') }}";
        }
    }

    // 3. Chat Logic
    function sendMsg() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if(!text) return;

        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML += `<div class="chat-bubble bubble-me">${text}</div>`;
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 4. TTS for Doctor (Immersion)
    function speak(text) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1;
        window.speechSynthesis.speak(utterance);
    }
    
    // Allow 'Enter' to send
    document.getElementById('chatInput').addEventListener('keypress', function(e) {
        if(e.key === 'Enter') sendMsg();
    });
</script>

</body>
</html>
