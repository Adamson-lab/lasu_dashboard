<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Calculator | L.I.S.A. Utilities</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --brand-orange: #fd7e14; /* Retail Orange */
            --brand-orange-light: rgba(253, 126, 20, 0.1);
            --bg-main: #f4f7f6;
            --bg-surface: #ffffff;
            --text-primary: #0f172a;
            --glass-border: rgba(0, 0, 0, 0.1);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding: 40px 20px;
        }
        .tool-container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--bg-surface);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid var(--glass-border);
        }
        .input-panel {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            height: 100%;
        }
        .form-label {
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-group-text {
            background: var(--bg-surface);
            border-color: #cbd5e1;
            color: #64748b;
            font-weight: 600;
        }
        .form-control, .form-select {
            border-color: #cbd5e1;
            font-weight: 600;
            font-size: 1.05rem;
            transition: 0.3s;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--brand-orange);
            box-shadow: 0 0 0 3px var(--brand-orange-light);
        }
        .result-card {
            background: linear-gradient(135deg, #fd7e14 0%, #c35a00 100%);
            color: white;
            padding: 30px 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(253, 126, 20, 0.2);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .result-card::after {
            content: '\f02b'; /* FA Tags */
            font-family: "Font Awesome 5 Free";
            font-weight: 900;
            position: absolute;
            right: -10px;
            bottom: -20px;
            font-size: 9rem;
            opacity: 0.1;
            pointer-events: none;
            transform: rotate(-10deg);
        }
        .result-value {
            font-size: 3.5rem;
            font-weight: 800;
            margin: 5px 0;
            letter-spacing: -1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .original-price-strike {
            font-size: 1.2rem;
            opacity: 0.8;
            text-decoration: line-through;
            font-weight: 600;
        }
        .breakdown-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed #cbd5e1;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .breakdown-row:last-child {
            border-bottom: none;
        }
        .color-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .chart-container {
            position: relative;
            height: 250px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .section-divider {
            margin: 25px 0 15px 0;
            border-top: 2px solid #e2e8f0;
            position: relative;
        }
        .section-divider span {
            position: absolute;
            top: -12px;
            left: 15px;
            background: #f8f9fa;
            padding: 0 10px;
            font-size: 0.75rem;
            font-weight: 800;
            color: #94a3b8;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="tool-container">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <h2 class="fw-bold m-0"><i class="fas fa-tags me-2" style="color: var(--brand-orange);"></i> Discount Calculator</h2>
            <a href="{{ url_for('student_portal') }}" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i> Back to Dashboard</a>
        </div>

        <div class="row g-4">
            <div class="col-lg-5">
                <div class="input-panel">
                    
                    <div class="d-flex justify-content-between align-items-end mb-4">
                        <div class="flex-grow-1 me-2">
                            <label class="form-label">Original Price</label>
                            <div class="input-group">
                                <span class="input-group-text dynamic-currency">$</span>
                                <input type="number" id="originalPrice" class="form-control" value="150" min="0" step="1" oninput="calculateDiscount()">
                            </div>
                        </div>
                        <div style="width: 90px;">
                            <label class="form-label">Currency</label>
                            <select id="currencySelect" class="form-select" onchange="updateCurrency()">
                                <option value="USD" selected>USD</option>
                                <option value="NGN">NGN</option>
                                <option value="EUR">EUR</option>
                                <option value="GBP">GBP</option>
                            </select>
                        </div>
                    </div>

                    <div class="section-divider"><span>PROMOTIONS</span></div>

                    <div class="mb-3">
                        <label class="form-label">Base Discount (% Off)</label>
                        <div class="input-group">
                            <input type="number" id="discount1" class="form-control" value="20" min="0" max="100" step="1" oninput="calculateDiscount()">
                            <span class="input-group-text">%</span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted" style="font-size:0.75rem;">Stacked Discount (Extra % Off)</label>
                        <div class="input-group input-group-sm">
                            <input type="number" id="discount2" class="form-control" value="0" min="0" max="100" step="1" oninput="calculateDiscount()">
                            <span class="input-group-text">%</span>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted" style="font-size:0.75rem;">Fixed Coupon (Amount Off)</label>
                        <div class="input-group input-group-sm">
                            <span class="input-group-text dynamic-currency">$</span>
                            <input type="number" id="fixedCoupon" class="form-control" value="0" min="0" step="1" oninput="calculateDiscount()">
                        </div>
                    </div>

                    <div class="section-divider"><span>TAXES</span></div>

                    <div class="mb-3">
                        <label class="form-label">Sales Tax</label>
                        <div class="input-group">
                            <input type="number" id="salesTax" class="form-control" value="8.5" min="0" step="0.1" oninput="calculateDiscount()">
                            <span class="input-group-text">%</span>
                        </div>
                    </div>

                    <button class="btn btn-outline-secondary w-100 fw-bold mt-2" onclick="resetCalculator()"><i class="fas fa-redo-alt me-2"></i>Reset Inputs</button>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="result-card">
                    <div class="text-uppercase fw-bold" style="font-size: 0.85rem; letter-spacing: 2px; opacity: 0.9;">Final Price (Including Tax)</div>
                    <div class="result-value" id="finalPriceDisplay">$0.00</div>
                    <div class="original-price-strike" id="originalPriceDisplay">$0.00</div>
                </div>

                <div class="row align-items-center g-4">
                    <div class="col-md-5">
                        <div class="chart-container">
                            <canvas id="discountChart"></canvas>
                        </div>
                    </div>
                    <div class="col-md-7">
                        <div style="background: var(--bg-surface); padding: 15px; border-radius: 12px; border: 1px solid var(--glass-border);">
                            <h6 class="fw-bold text-uppercase mb-3" style="font-size: 0.75rem; color: #64748b; letter-spacing: 1px;">Cost Breakdown</h6>
                            
                            <div class="breakdown-row">
                                <div><span class="color-dot" style="background: #e2e8f0;"></span> <span class="text-muted">Original Price</span></div>
                                <span class="text-dark" id="breakdownOriginal">$0.00</span>
                            </div>
                            <div class="breakdown-row">
                                <div><span class="color-dot" style="background: #198754;"></span> <span class="text-success fw-bold">Total Saved</span></div>
                                <span class="text-success fw-bold" id="breakdownSaved">-$0.00</span>
                            </div>
                            <div class="breakdown-row border-0">
                                <div><span class="color-dot" style="background: #dc3545;"></span> <span class="text-danger">Tax Added</span></div>
                                <span class="text-danger" id="breakdownTax">+$0.00</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let discountChartInstance = null;
        let currentCurrency = 'USD';

        document.addEventListener("DOMContentLoaded", () => {
            updateCurrency();
        });

        function updateCurrency() {
            currentCurrency = document.getElementById('currencySelect').value;
            const symbols = { 'USD': '$', 'NGN': '₦', 'EUR': '€', 'GBP': '£' };
            const sym = symbols[currentCurrency];
            
            document.querySelectorAll('.dynamic-currency').forEach(el => {
                el.innerText = sym;
            });
            
            calculateDiscount();
        }

        function formatMoney(amount) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: currentCurrency,
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(amount);
        }

        function calculateDiscount() {
            const originalPrice = parseFloat(document.getElementById('originalPrice').value) || 0;
            const pct1 = parseFloat(document.getElementById('discount1').value) || 0;
            const pct2 = parseFloat(document.getElementById('discount2').value) || 0;
            const fixedOff = parseFloat(document.getElementById('fixedCoupon').value) || 0;
            const taxPct = parseFloat(document.getElementById('salesTax').value) || 0;

            if (originalPrice <= 0) {
                updateUI(0, 0, 0, 0);
                return;
            }

            // 1. Sequential Discount Processing (Enterprise Retailing Logic)
            // Apply first percentage
            let discountedPrice = originalPrice * (1 - (pct1 / 100));
            
            // Apply secondary stacked percentage to the NEW subtotal
            discountedPrice = discountedPrice * (1 - (pct2 / 100));
            
            // Apply fixed dollar amount coupon
            discountedPrice = discountedPrice - fixedOff;
            
            // Prevent negative prices
            discountedPrice = Math.max(0, discountedPrice);

            // 2. Calculate Total Savings
            const totalSaved = originalPrice - discountedPrice;

            // 3. Apply Sales Tax to the discounted price
            const taxAmount = discountedPrice * (taxPct / 100);
            
            // 4. Final Total
            const finalPrice = discountedPrice + taxAmount;

            updateUI(originalPrice, finalPrice, totalSaved, taxAmount, discountedPrice);
        }

        function updateUI(original, final, saved, tax, pureDiscountedPrice) {
            document.getElementById('originalPriceDisplay').innerText = formatMoney(original);
            document.getElementById('finalPriceDisplay').innerText = formatMoney(final);
            
            document.getElementById('breakdownOriginal').innerText = formatMoney(original);
            document.getElementById('breakdownSaved').innerText = `-${formatMoney(saved)}`;
            document.getElementById('breakdownTax').innerText = `+${formatMoney(tax)}`;

            renderChart(pureDiscountedPrice, saved, tax, original);
        }

        function renderChart(discountedPrice, saved, tax, original) {
            const ctx = document.getElementById('discountChart').getContext('2d');
            
            if (discountChartInstance) {
                discountChartInstance.destroy();
            }

            if (original === 0) return;

            discountChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Actual Item Cost', 'Amount Saved', 'Sales Tax'],
                    datasets: [{
                        data: [discountedPrice, saved, tax],
                        backgroundColor: [
                            '#fd7e14', // Base Item Cost (Orange)
                            '#198754', // Saved (Green)
                            '#dc3545'  // Tax (Red)
                        ],
                        borderWidth: 2,
                        borderColor: '#ffffff',
                        hoverOffset: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '65%',
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ` ${context.label}: ${formatMoney(context.raw)}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function resetCalculator() {
            document.getElementById('originalPrice').value = 150;
            document.getElementById('discount1').value = 20;
            document.getElementById('discount2').value = 0;
            document.getElementById('fixedCoupon').value = 0;
            document.getElementById('salesTax').value = 8.5;
            calculateDiscount();
        }
    </script>
</body>
</html>
