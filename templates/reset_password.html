<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Password - LASU Analytics</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        [data-theme="light"] {
            --bg-master: #f8fafc;
            --bg-surface: #ffffff;
            --border-core: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --grid-line: rgba(0, 0, 0, 0.03);
            --shadow-core: 0 15px 35px rgba(0, 0, 0, 0.05);
            --primary-blue: #0ea5e9;
            --primary-hover: #0284c7;
            --danger-red: #ef4444;
        }

        body {
            font-family: 'Inter', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-master);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .auth-card {
            width: 100%;
            max-width: 550px;
            background: var(--bg-surface);
            border: 1px solid var(--border-core);
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: var(--shadow-core);
            text-align: center;
            margin: 20px;
        }

        .auth-title {
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--text-main);
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .auth-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-control-v70 {
            background: var(--bg-master);
            border: 2px solid var(--border-core);
            color: var(--text-main);
            padding: 12px 15px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .form-control-v70:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
            outline: none;
            background: var(--bg-surface);
        }

        .btn-primary-v70 {
            background: var(--primary-blue);
            color: #ffffff;
            border: none;
            font-weight: 700;
            padding: 14px 20px;
            border-radius: 8px;
            letter-spacing: 0.5px;
            transition: all 0.2s;
            width: 100%;
            font-size: 1.05rem;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        .btn-primary-v70:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(14, 165, 233, 0.3);
        }

        .v70-alert {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger-red);
            color: var(--danger-red);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
    </style>

    <link rel="icon" type="image/jpeg" sizes="32x32" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
    <link rel="icon" type="image/jpeg" sizes="16x16" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
</head>
<body>

    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="{{ url_for('static', filename='lasu_logo.jpg') }}" alt="LASU Logo" style="width: 75px; height: auto;">
        </div>
        
        <h3 class="auth-title">Create New Password</h3>
        <p class="auth-subtitle">Your identity has been verified. Please create a strong, new password for your account.</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="v70-alert" {% if category == 'warning' %} style="border-color: #f59e0b; color: #b45309; background: rgba(245, 158, 11, 0.1);" {% endif %}>
                        <i class="fas fa-exclamation-circle me-2"></i> {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="text-start mb-3">
                <label class="form-label fw-bold text-muted small text-uppercase">New Password</label>
                <input type="password" name="new_password" class="form-control form-control-v70" placeholder="Minimum 6 characters" required autofocus>
            </div>

            <div class="text-start mb-3">
                <label class="form-label fw-bold text-muted small text-uppercase">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-control form-control-v70" placeholder="Re-type new password" required>
            </div>
            
            <button type="submit" class="btn-primary-v70">
                <i class="fas fa-lock me-2"></i> Secure My Account
            </button>
        </form>
    </div>

</body>
</html>
