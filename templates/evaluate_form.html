<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rate Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .rating-stars { display: flex; flex-direction: row-reverse; justify-content: center; gap: 10px; }
        .rating-stars input { display: none; }
        .rating-stars label { font-size: 2rem; color: #ddd; cursor: pointer; transition: color 0.2s; }
        .rating-stars input:checked ~ label,
        .rating-stars label:hover,
        .rating-stars label:hover ~ label { color: #ffc107; }
    </style>

    
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Rate {{ course.code }}</h5>
        </div>
        <div class="card-body text-center">
            <h3 class="mb-3">{{ course.title }}</h3>
            <p class="text-muted">How was your experience with this course and lecturer?</p>
            
            <form method="POST">
                <div class="mb-4">
                    <label class="form-label fw-bold">Select Rating</label>
                    <div class="rating-stars">
                        <input type="radio" name="rating" id="star5" value="5" required><label for="star5">★</label>
                        <input type="radio" name="rating" id="star4" value="4"><label for="star4">★</label>
                        <input type="radio" name="rating" id="star3" value="3"><label for="star3">★</label>
                        <input type="radio" name="rating" id="star2" value="2"><label for="star2">★</label>
                        <input type="radio" name="rating" id="star1" value="1"><label for="star1">★</label>
                    </div>
                    <div class="small text-muted mt-1">1 = Poor, 5 = Excellent</div>
                </div>
                
                <div class="mb-3 text-start">
                    <label class="form-label fw-bold">Additional Comments (Optional)</label>
                    <textarea name="comment" class="form-control" rows="4" placeholder="Share your thoughts anonymously..."></textarea>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success btn-lg">Submit Feedback</button>
                    <a href="{{ url_for('student_evaluations_list') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
