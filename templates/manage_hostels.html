<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Hostels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4 py-3">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">LASU Analytics</a>
        <div class="d-flex align-items-center gap-3 text-white">
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-light btn-sm">← Back to Dashboard</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-success text-white fw-bold">🏠 Add New Hostel</div>
                <div class="card-body">
                    <form action="{{ url_for('manage_hostels') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Hostel Name</label>
                            <input type="text" name="name" class="form-control" placeholder="e.g. Biobaku Hall" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Capacity (Bed Spaces)</label>
                            <input type="number" name="capacity" class="form-control" value="100" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Fee (₦)</label>
                            <input type="number" name="price" class="form-control" value="20000" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Create Hostel</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold">Existing Hostels</div>
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Occupancy</th>
                                <th>Price</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for hostel in hostels %}
                            <tr>
                                <td class="fw-bold">{{ hostel.name }}</td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <div class="progress flex-grow-1" style="height: 8px; width: 100px;">
                                            <div class="progress-bar bg-success" style="width: {{ (hostel.occupied / hostel.capacity) * 100 }}%"></div>
                                        </div>
                                        <small>{{ hostel.occupied }}/{{ hostel.capacity }}</small>
                                    </div>
                                </td>
                                <td>₦{{ "{:,.0f}".format(hostel.price) }}</td>
                                <td>
                                    <form action="{{ url_for('delete_hostel', id=hostel.id) }}" method="POST" onsubmit="return confirm('Delete this hostel?');">
                                        <button type="submit" class="btn btn-outline-danger btn-sm">🗑️</button>
                                    </form>
                                </td>
                            </tr>
                            {% else %}
                            <tr><td colspan="4" class="text-center py-4 text-muted">No hostels created yet.</td></tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
