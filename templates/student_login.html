<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            /* 🟢 THE FIX: Exact original filename, raw image, no color overlay */
            background: url("{{ url_for('static', filename='photo-1522202176988-66273c2fd55f.avif') }}") no-repeat center center fixed;
            background-size: cover;
            
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0;
            padding: 15px;
        }
        .login-card { 
            width: 100%; 
            max-width: 555px; /* TIGHTER WIDTH */
            border-radius: 12px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); /* Deepened shadow to pop off background */
            border: none;
            border-top: 4px solid #198754; 
            background: white;
        }
        .card-body {
            padding: 30px; /* REDUCED PADDING */
        }
        .brand-logo {
            width: 80px; 
            height: auto;
            display: block;
            margin: 0 auto 10px auto;
        }
    </style>

    <link rel="icon" type="image/jpeg" sizes="32x32" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
    <link rel="icon" type="image/jpeg" sizes="16x16" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
</head>
<body>

    <div class="card login-card">
        <div class="card-body">
            
            <img src="{{ url_for('static', filename='lasu_logo.jpg') }}" alt="LASU Logo" class="brand-logo">

            <h3 class="text-center fw-bold text-success mb-1 fs-4">STUDENT PORTAL</h3>
            <p class="text-center text-muted mb-3 small">Check Your Semester Results</p>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="alert alert-danger text-center py-1 mb-3 small" style="font-size: 0.85rem;">{{ messages[0] }}</div>
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="mb-2">
                    <label class="form-label fw-bold small text-secondary mb-1">Matric Number</label>
                    <input type="text" name="matric_no" class="form-control form-control-sm" placeholder="e.g. CSC/2021/1234" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small text-secondary mb-1">Surname (Password)</label>
                    <input type="text" name="surname" class="form-control form-control-sm" placeholder="Enter your surname" required>
                </div>

                <button type="submit" class="btn btn-success w-100 fw-bold py-2 btn-sm">Check Result</button>
            </form>
            
            <div class="text-center mt-3 pt-2 border-top">
                <small class="text-muted d-block mb-1" style="font-size: 0.8rem;">Are you a Lecturer?</small>
                <a href="{{ url_for('login') }}" class="btn btn-outline-primary btn-sm fw-bold w-100">
                    👨‍🏫 Go to Staff Portal
                </a>
            </div>
        </div>
    </div>

</body>
</html>
