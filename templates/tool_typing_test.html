<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V5000 Neuro-Kinetic Matrix | L.I.S.A. Utilities</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* ==========================================
           V5000 NEURO-KINETIC THEME ENGINE
           ========================================== */
        
        [data-theme="dark"] {
            --nk-bg: #0b0f19;
            --nk-surface: #131a2a;
            --nk-text: #e2e8f0;
            --nk-text-muted: #475569;
            --nk-accent: #0ea5e9; /* Cyber Blue */
            --nk-error: #ef4444; /* Alert Red */
            --nk-success: #10b981; /* Valid Green */
            --nk-border: #1e293b;
            --nk-glow: rgba(14, 165, 233, 0.2);
        }

        [data-theme="light"] {
            --nk-bg: #f8fafc;
            --nk-surface: #ffffff;
            --nk-text: #0f172a;
            --nk-text-muted: #94a3b8;
            --nk-accent: #2563eb; /* Corporate Blue */
            --nk-error: #dc2626; 
            --nk-success: #059669; 
            --nk-border: #e2e8f0;
            --nk-glow: rgba(37, 99, 235, 0.15);
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--nk-bg);
            color: var(--nk-text);
            transition: all 0.3s ease;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .test-container {
            width: 100%;
            max-width: 1000px;
        }

        /* HUD Header */
        .nk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--nk-border);
        }

        .nk-title {
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            text-shadow: 0 0 15px var(--nk-glow);
        }

        .btn-nav {
            background: transparent;
            color: var(--nk-text);
            border: 1px solid var(--nk-border);
            padding: 10px 20px;
            font-weight: 900;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-nav:hover { background: var(--nk-surface); border-color: var(--nk-accent); color: var(--nk-accent); }

        /* Telemetry Dashboard */
        .telemetry-dash {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .telemetry-node {
            background: var(--nk-surface);
            border: 1px solid var(--nk-border);
            padding: 20px;
            text-align: center;
            border-radius: 4px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .node-val {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--nk-accent);
            line-height: 1;
            margin-bottom: 5px;
        }

        .node-lbl {
            font-size: 0.85rem;
            font-weight: 900;
            color: var(--nk-text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* The Typing Arena */
        .arena-box {
            background: var(--nk-surface);
            border: 1px solid var(--nk-border);
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            position: relative;
        }

        .word-pool {
            font-size: 1.8rem;
            line-height: 1.8;
            color: var(--nk-text-muted);
            font-weight: bold;
            height: 140px;
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 10px 15px;
            user-select: none;
            margin-bottom: 30px;
        }

        .word-span {
            padding: 2px 5px;
            border-radius: 4px;
            transition: background 0.1s, color 0.1s;
        }

        /* Dynamic Status Classes for Words */
        .word-active {
            background-color: var(--nk-border);
            color: var(--nk-text);
            box-shadow: 0 4px 0 var(--nk-accent);
        }
        .word-correct { color: var(--nk-success); }
        .word-incorrect { color: var(--nk-error); text-decoration: line-through; }

        /* Kinetic Input Field */
        .kinetic-input {
            width: 100%;
            background: transparent;
            border: 2px solid var(--nk-border);
            color: var(--nk-text);
            font-family: 'Courier New', Courier, monospace;
            font-size: 2rem;
            font-weight: 900;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .kinetic-input:focus {
            border-color: var(--nk-accent);
            box-shadow: 0 0 20px var(--nk-glow);
        }
        .kinetic-input.error-state {
            border-color: var(--nk-error);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
            background: rgba(239, 68, 68, 0.05);
        }

        /* Controls */
        .test-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn-action {
            background: var(--nk-surface);
            color: var(--nk-text);
            border: 2px solid var(--nk-border);
            padding: 15px 30px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
        }
        .btn-action:hover {
            border-color: var(--nk-accent);
            color: var(--nk-accent);
        }
        
        .overlay-blocker {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border-radius: 8px;
        }

    </style>

    
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
</head>
<body>

    <div class="test-container">
        
        <div class="nk-header">
            <div>
                <h1 class="nk-title">Neuro-Kinetic Matrix</h1>
                <div style="font-size: 0.8rem; font-weight: bold; color: var(--nk-text-muted); letter-spacing: 3px; margin-top: 5px;">V5000 Biometric Typing Engine</div>
            </div>
            <div class="d-flex gap-3">
                <button class="btn-nav" onclick="toggleNeuroTheme()"><i class="fas fa-adjust"></i></button>
                <a href="{{ url_for('student_tools_dashboard') }}" class="btn-nav"><i class="fas fa-arrow-left me-2"></i> Dashboard</a>
            </div>
        </div>

        <div class="telemetry-dash">
            <div class="telemetry-node">
                <div class="node-val" id="hudWPM">00</div>
                <div class="node-lbl">WPM</div>
            </div>
            <div class="telemetry-node">
                <div class="node-val" id="hudAccuracy">100</div>
                <div class="node-lbl">Accuracy %</div>
            </div>
            <div class="telemetry-node">
                <div class="node-val" id="hudErrors">0</div>
                <div class="node-lbl">Mistakes</div>
            </div>
            <div class="telemetry-node" style="border-color: var(--nk-accent);">
                <div class="node-val" id="hudTime">60</div>
                <div class="node-lbl" style="color: var(--nk-accent);">Time (Sec)</div>
            </div>
        </div>

        <div class="arena-box">
            
            <div class="overlay-blocker" id="completionOverlay">
                <div style="font-size: 4rem; font-weight: 900; color: var(--nk-accent); margin-bottom: 10px;">TEST COMPLETE</div>
                <div style="font-size: 1.5rem; font-weight: bold; color: var(--nk-text);">Check telemetry data above.</div>
                <button class="btn-action mt-4" onclick="initializeTestEngine()" style="background: var(--nk-accent); color: #000; border-color: var(--nk-accent);">RESTART PROTOCOL</button>
            </div>

            <div class="word-pool" id="wordContainer">
                </div>

            <input type="text" class="kinetic-input" id="typingInput" placeholder="Type here to ignite engine..." autocomplete="off" spellcheck="false" autocorrect="off">

        </div>

        <div class="test-controls">
            <button class="btn-action" onclick="initializeTestEngine()">Force Reset</button>
            <select class="btn-action" id="timeSelector" onchange="initializeTestEngine()">
                <option value="60">60 Seconds</option>
                <option value="30">30 Seconds</option>
                <option value="15">15 Seconds</option>
            </select>
        </div>

    </div>

    <script>
        // ==========================================
        // V5000 THEME ENGINE
        // ==========================================
        function toggleNeuroTheme() {
            let htmlElement = document.documentElement;
            let currentTheme = htmlElement.getAttribute('data-theme');
            let nextTheme;

            if (currentTheme === "light") {
                nextTheme = "dark";
            } else {
                nextTheme = "light";
            }

            htmlElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('lisa_v5000_typing', nextTheme);
        }

        document.addEventListener("DOMContentLoaded", function() {
            let savedTheme = localStorage.getItem('lisa_v5000_typing');
            if (savedTheme !== null) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
            
            initializeTestEngine();
        });

        // ==========================================
        // V5000 BIOMETRIC ENGINE ARCHITECTURE
        // ZERO ARROW FUNCTIONS. ZERO TERNARIES.
        // ==========================================

        let dictionaryArray = [
            "the", "be", "to", "of", "and", "a", "in", "that", "have", "I", "it", "for", "not", "on", "with", "he", "as", "you", "do", "at",
            "this", "but", "his", "by", "from", "they", "we", "say", "her", "she", "or", "an", "will", "my", "one", "all", "would", "there", "their", "what",
            "so", "up", "out", "if", "about", "who", "get", "which", "go", "me", "when", "make", "can", "like", "time", "no", "just", "him", "know", "take",
            "people", "into", "year", "your", "good", "some", "could", "them", "see", "other", "than", "then", "now", "look", "only", "come", "its", "over", "think", "also",
            "back", "after", "use", "two", "how", "our", "work", "first", "well", "way", "even", "new", "want", "because", "any", "these", "give", "day", "most", "us",
            "system", "data", "matrix", "network", "protocol", "server", "logic", "terminal", "cyber", "access", "control", "engine", "input", "output", "virtual", "memory", "cache", "vector", "cloud"
        ];

        let activeWordsArray = [];
        let currentWordIndex = 0;
        
        let totalTimeSeconds = 60;
        let timeRemaining = 60;
        let timerIntervalObject = null;
        let isEngineActive = false;
        
        let correctKeystrokesCount = 0;
        let totalKeystrokesCount = 0;
        let errorCount = 0;

        function shuffleArray(targetArray) {
            let copiedArray = targetArray.slice();
            for (let i = copiedArray.length - 1; i > 0; i = i - 1) {
                let randomIndex = Math.floor(Math.random() * (i + 1));
                let temporaryValue = copiedArray[i];
                copiedArray[i] = copiedArray[randomIndex];
                copiedArray[randomIndex] = temporaryValue;
            }
            return copiedArray;
        }

        function initializeTestEngine() {
            // Stop any running timers
            if (timerIntervalObject !== null) {
                clearInterval(timerIntervalObject);
                timerIntervalObject = null;
            }

            // Reset Global State
            isEngineActive = false;
            currentWordIndex = 0;
            correctKeystrokesCount = 0;
            totalKeystrokesCount = 0;
            errorCount = 0;

            let timeSelectorValue = document.getElementById('timeSelector').value;
            totalTimeSeconds = parseInt(timeSelectorValue, 10);
            timeRemaining = totalTimeSeconds;

            // Reset HUD
            document.getElementById('hudWPM').innerText = "00";
            document.getElementById('hudAccuracy').innerText = "100";
            document.getElementById('hudErrors').innerText = "0";
            document.getElementById('hudTime').innerText = String(timeRemaining);
            
            document.getElementById('completionOverlay').style.display = "none";
            
            let inputElement = document.getElementById('typingInput');
            inputElement.value = "";
            inputElement.disabled = false;
            inputElement.classList.remove("error-state");
            inputElement.focus();

            // Generate Arena Words (Massive pool so we never run out)
            activeWordsArray = [];
            for (let loop = 0; loop < 10; loop = loop + 1) {
                let shuffledSubset = shuffleArray(dictionaryArray);
                for (let j = 0; j < shuffledSubset.length; j = j + 1) {
                    activeWordsArray.push(shuffledSubset[j]);
                }
            }

            let containerElement = document.getElementById('wordContainer');
            containerElement.innerHTML = "";

            for (let i = 0; i < 60; i = i + 1) {
                let spanElement = document.createElement("span");
                spanElement.className = "word-span";
                spanElement.id = "word_" + String(i);
                spanElement.innerText = activeWordsArray[i];
                containerElement.appendChild(spanElement);
            }

            // Set the first word active
            document.getElementById('word_0').classList.add("word-active");
        }

        function triggerEngineStart() {
            isEngineActive = true;
            timerIntervalObject = setInterval(executeTimerTick, 1000);
        }

        function executeTimerTick() {
            timeRemaining = timeRemaining - 1;
            document.getElementById('hudTime').innerText = String(timeRemaining);

            updateRealTimeTelemetry();

            if (timeRemaining <= 0) {
                haltEngine();
            }
        }

        function updateRealTimeTelemetry() {
            // Accuracy
            let accuracyPercentage = 100;
            if (totalKeystrokesCount > 0) {
                accuracyPercentage = (correctKeystrokesCount / totalKeystrokesCount) * 100;
            }
            
            let finalAccuracy = Math.round(accuracyPercentage);
            document.getElementById('hudAccuracy').innerText = String(finalAccuracy);
            document.getElementById('hudErrors').innerText = String(errorCount);

            // WPM Math: Standard definition of a "word" is 5 characters.
            // Formula: (Correct Characters / 5) / Time Elapsed in Minutes
            let timeElapsedSeconds = totalTimeSeconds - timeRemaining;
            
            if (timeElapsedSeconds > 0) {
                let timeElapsedMinutes = timeElapsedSeconds / 60.0;
                let grossWordsTyped = correctKeystrokesCount / 5.0;
                let calculatedWPM = Math.round(grossWordsTyped / timeElapsedMinutes);
                
                document.getElementById('hudWPM').innerText = String(calculatedWPM);
            }
        }

        function haltEngine() {
            clearInterval(timerIntervalObject);
            timerIntervalObject = null;
            isEngineActive = false;
            
            let inputElement = document.getElementById('typingInput');
            inputElement.disabled = true;
            inputElement.value = "";
            
            // Final telemetry update
            updateRealTimeTelemetry();
            
            document.getElementById('completionOverlay').style.display = "flex";
        }

        // ==========================================
        // INPUT TRACKING EVENT LISTENER
        // ==========================================
        
        let typingInputElement = document.getElementById('typingInput');
        
        typingInputElement.addEventListener('input', function(eventObject) {
            
            if (timeRemaining <= 0) {
                return;
            }

            if (isEngineActive === false) {
                triggerEngineStart();
            }

            let typedValueString = typingInputElement.value;
            let currentTargetWord = activeWordsArray[currentWordIndex];
            
            // Check if user hit spacebar (Word Completion)
            let lastCharacter = typedValueString.charAt(typedValueString.length - 1);
            
            if (lastCharacter === " ") {
                let cleanedTypedWord = typedValueString.trim();
                let targetSpanElement = document.getElementById('word_' + String(currentWordIndex));

                // Remove active styling
                targetSpanElement.classList.remove("word-active");

                // Evaluate Word
                if (cleanedTypedWord === currentTargetWord) {
                    targetSpanElement.classList.add("word-correct");
                    correctKeystrokesCount = correctKeystrokesCount + currentTargetWord.length + 1; // +1 for the space
                } else {
                    targetSpanElement.classList.add("word-incorrect");
                    errorCount = errorCount + 1;
                }

                totalKeystrokesCount = totalKeystrokesCount + cleanedTypedWord.length + 1;

                // Advance to next word
                currentWordIndex = currentWordIndex + 1;
                typingInputElement.value = "";
                typingInputElement.classList.remove("error-state");

                // Highlight next word
                let nextSpanElement = document.getElementById('word_' + String(currentWordIndex));
                if (nextSpanElement !== null) {
                    nextSpanElement.classList.add("word-active");
                    
                    // Auto-scroll logic if we reach the end of the visible line
                    let containerElement = document.getElementById('wordContainer');
                    if (nextSpanElement.offsetTop > 100) {
                        // Remove top line of words by simply clearing and re-rendering offset
                        // For stability, we just let it wrap or push down. 
                        // Actually, to prevent breaking, let's reset the board dynamically if we hit word 50
                        if (currentWordIndex > 50) {
                            initializeTestEngine(); // Hacky but safe for V210 limits
                        }
                    }
                }

            } else {
                // Live Error Checking (While typing the word)
                let isMatchSoFar = true;
                
                for (let i = 0; i < typedValueString.length; i = i + 1) {
                    if (typedValueString.charAt(i) !== currentTargetWord.charAt(i)) {
                        isMatchSoFar = false;
                    }
                }

                if (isMatchSoFar === false) {
                    typingInputElement.classList.add("error-state");
                } else {
                    typingInputElement.classList.remove("error-state");
                }
            }
        });

    </script>
</body>
</html>
