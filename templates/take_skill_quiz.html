<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Taking Quiz: {{ quiz.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; padding-top: 50px; }
        .quiz-container { max-width: 700px; margin: 0 auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .question-box { margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        .form-check-label { cursor: pointer; padding: 5px; width: 100%; }
        .form-check:hover { background-color: #f0f8ff; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="quiz-container">
        <div class="text-center mb-5">
            <h2 class="fw-bold">{{ quiz.title }}</h2>
            <span class="badge bg-secondary">Pass Mark: 70%</span>
        </div>

        <form action="{{ url_for('submit_skill_quiz', id=quiz.id) }}" method="POST">
            {% for q in questions %}
            <div class="question-box">
                <h5 class="fw-bold mb-3">{{ loop.index }}. {{ q.q }}</h5>
                {% for opt in q.options %}
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="q{{ loop.index0 }}" id="opt_{{ loop.index0 }}_{{ loop.index }}" value="{{ opt }}" required>
                    <label class="form-check-label" for="opt_{{ loop.index0 }}_{{ loop.index }}">
                        {{ opt }}
                    </label>
                </div>
                {% endfor %}
            </div>
            {% endfor %}

            <div class="d-flex justify-content-between mt-4">
                <a href="{{ url_for('student_skills') }}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary px-5 fw-bold">Submit Answers</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
