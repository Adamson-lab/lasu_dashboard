<!DOCTYPE html>
<html lang="en">
<head>
    <title>L.I.S.A. Intelligence</title>
    <style>
        body { display: flex; height: 100vh; margin: 0; font-family: sans-serif; background: #0e0e0e; color: white; }
        /* Sidebar Styles */
        #sidebar { width: 260px; background: #171717; padding: 15px; display: flex; flex-direction: column; border-right: 1px solid #333; }
        .new-chat-btn { padding: 10px; background: #343541; border: 1px solid #4d4d4d; color: white; cursor: pointer; border-radius: 5px; margin-bottom: 20px; }
        .chat-history-item { padding: 10px; margin: 5px 0; cursor: pointer; border-radius: 5px; font-size: 0.9em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-history-item:hover { background: #2a2b32; }
        
        /* Main Chat Area */
        #main-chat { flex-grow: 1; display: flex; flex-direction: column; }
        #chat-window { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px; border-radius: 10px; line-height: 1.5; }
        .user { align-self: flex-end; background: #2b2d31; color: white; }
        .assistant { align-self: flex-start; background: #444654; color: white; }
        
        /* Input Area */
        #input-area { padding: 20px; background: #0e0e0e; }
        #user-input { width: 100%; padding: 15px; background: #40414f; border: none; color: white; border-radius: 8px; outline: none; }
    </style>

    
    

    <link rel="icon" type="image/jpeg" sizes="32x32" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
    <link rel="icon" type="image/jpeg" sizes="16x16" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
</head>
<body>

<div id="sidebar">
    <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
    <div id="history-list">
        {% for chat in student.chats %}
        <div class="chat-history-item" onclick="loadChat({{ chat.id }})">
            {{ chat.title }}
        </div>
        {% endfor %}
    </div>
</div>

<div id="main-chat">
    <div id="chat-window">
        </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Message L.I.S.A..." onkeypress="handleKey(event)">
    </div>
</div>

<script>
    // 1. Send Message to ask_lisa
    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value;
        if (!text) return;

        appendMessage('user', text);
        input.value = '';

        const response = await fetch('/api/ask_lisa', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: text})
        });
        const data = await response.json();
        appendMessage('assistant', data.response);
    }

    // 2. Load an Old Chat
    async function loadChat(chatId) {
        const response = await fetch(`/api/load_chat/${chatId}`);
        const data = await response.json();
        const window = document.getElementById('chat-window');
        window.innerHTML = ''; // Clear current screen
        data.history.forEach(m => appendMessage(m.role, m.content));
    }

    // 3. Start a New Chat
    async function createNewChat() {
        await fetch('/api/new_chat', {method: 'POST'});
        location.reload(); // Refresh to update sidebar and clear window
    }

    function appendMessage(role, text) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.innerText = text;
        document.getElementById('chat-window').appendChild(div);
    }

    function handleKey(e) { if(e.key === 'Enter') sendMessage(); }
</script>

</body>
</html>
