<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V100000000 Orbital Centrifuge | L.I.S.A. Utilities</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* ==========================================
           V100000000 CENTRIFUGE THEME ENGINE
           ========================================== */
        
        [data-theme="dark"] {
            --nk-bg: #05080f;
            --nk-surface: #101623;
            --nk-text: #e2e8f0;
            --nk-text-muted: #475569;
            --nk-accent: #ec4899; /* Neon Pink */
            --nk-accent-glow: rgba(236, 72, 153, 0.4);
            --nk-border: #1e293b;
            --nk-pointer: #ffffff;
            --nk-ledger-bg: #0b0f19;
        }

        [data-theme="light"] {
            --nk-bg: #f8fafc;
            --nk-surface: #ffffff;
            --nk-text: #0f172a;
            --nk-text-muted: #94a3b8;
            --nk-accent: #db2777; 
            --nk-accent-glow: rgba(219, 39, 119, 0.3);
            --nk-border: #cbd5e1;
            --nk-pointer: #000000;
            --nk-ledger-bg: #f1f5f9;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--nk-bg);
            color: var(--nk-text);
            transition: all 0.3s ease;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        .test-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        /* HUD Header */
        .nk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--nk-border);
        }

        .nk-title {
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            color: var(--nk-accent);
            text-shadow: 0 0 15px var(--nk-accent-glow);
        }

        .btn-nav {
            background: transparent;
            color: var(--nk-text);
            border: 1px solid var(--nk-border);
            padding: 10px 20px;
            font-weight: 900;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            border-radius: 4px;
        }
        .btn-nav:hover { background: var(--nk-surface); border-color: var(--nk-accent); color: var(--nk-accent); }

        /* Layout Structure */
        .main-layout {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            justify-content: center;
            margin-top: 20px;
        }

        @media (max-width: 900px) {
            .main-layout { flex-direction: column-reverse; align-items: center; }
            .control-panel, .arena-box { width: 100%; max-width: 500px; }
        }

        /* Control Panel */
        .control-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--nk-surface);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--nk-border);
            min-width: 320px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .panel-label {
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--nk-text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .form-input {
            background-color: var(--nk-bg);
            color: var(--nk-text);
            border: 2px solid var(--nk-border);
            padding: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            outline: none;
            width: 100%;
            min-height: 120px;
            resize: vertical;
        }
        .form-input:focus { border-color: var(--nk-accent); }

        .btn-action {
            background: var(--nk-accent);
            color: #ffffff;
            border: none;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 0 20px var(--nk-accent-glow);
        }
        .btn-action:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 5px 25px var(--nk-accent-glow); }
        .btn-action:disabled { background: var(--nk-border); color: var(--nk-text-muted); cursor: not-allowed; transform: none; box-shadow: none; }

        .btn-secondary {
            background: transparent;
            color: var(--nk-text);
            border: 2px solid var(--nk-border);
            padding: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: none;
        }
        .btn-secondary:hover { border-color: var(--nk-text); color: var(--nk-text); transform: none; }

        /* The Centrifuge Arena */
        .arena-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
        }

        .wheel-container {
            position: relative;
            width: 350px;
            height: 350px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        /* The Physical Wheel */
        .physical-wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid var(--nk-border);
            box-shadow: 0 0 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            /* Cubic bezier creates realistic physical friction deceleration */
            transition: transform 5s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        /* The Core Hub */
        .wheel-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background-color: var(--nk-surface);
            border: 4px solid var(--nk-text);
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        /* The Geometric Labels */
        .slice-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 0 0;
            font-weight: 900;
            font-size: 1rem;
            color: #ffffff;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
            white-space: nowrap;
            pointer-events: none;
        }

        /* The Tactical Pointer */
        .pointer-container {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
        }

        .pointer-triangle {
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid var(--nk-pointer);
        }

        /* Execution Ledger */
        .ledger-box {
            width: 100%;
            background-color: var(--nk-ledger-bg);
            border: 1px solid var(--nk-border);
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ledger-item {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--nk-accent);
            border-bottom: 1px dashed var(--nk-border);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        .ledger-item:last-child { border-bottom: none; }

        .ledger-timestamp {
            font-size: 0.8rem;
            color: var(--nk-text-muted);
            font-family: 'Courier New', Courier, monospace;
        }

        @media (max-width: 500px) {
            .wheel-container { width: 280px; height: 280px; }
            .slice-label { font-size: 0.8rem; }
        }

    </style>

    
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
</head>
<body>

    <div class="test-container">
        
        <div class="nk-header">
            <div>
                <h1 class="nk-title">Orbital Centrifuge</h1>
                <div style="font-size: 0.8rem; font-weight: bold; color: var(--nk-text-muted); letter-spacing: 3px; margin-top: 5px;">V100000000 Probability Singularity Matrix</div>
            </div>
            <div class="d-flex gap-3">
                <button class="btn-nav" onclick="toggleCentrifugeTheme()"><i class="fas fa-adjust"></i></button>
                <a href="{{ url_for('student_tools_dashboard') }}" class="btn-nav"><i class="fas fa-arrow-left me-2"></i> Dashboard</a>
            </div>
        </div>

        <div class="main-layout">
            
            <div class="control-panel">
                
                <div>
                    <div class="panel-label">Input Data Nodes (One per line)</div>
                    <textarea class="form-input" id="dataInput">Alpha Squadron
Bravo Team
Charlie Unit
Delta Force
Echo Protocol</textarea>
                </div>

                <div style="border-top: 1px solid var(--nk-border); margin: 5px 0;"></div>

                <div>
                    <div class="panel-label">Deathmatch Protocol</div>
                    <select id="eliminationMode" class="form-input" style="min-height: auto; cursor: pointer;">
                        <option value="OFF" selected>Disabled (Persistent Nodes)</option>
                        <option value="ON">Enabled (Eliminate Victorious Node)</option>
                    </select>
                </div>

                <button class="btn-secondary" onclick="renderPhysicalWheel()"><i class="fas fa-sync-alt me-2"></i> Recompile Matrix</button>

                <button class="btn-action" id="btnSpin" onclick="executeCentrifugeSpin()"><i class="fas fa-dharmachakra me-2"></i> Ignite Centrifuge</button>

                <div id="systemStatus" style="text-align: center; margin-top: 15px; font-weight: bold; color: var(--nk-text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">
                    MATRIX STABLE
                </div>

            </div>

            <div class="arena-box">
                
                <div class="wheel-container">
                    <div class="pointer-container">
                        <div class="pointer-triangle"></div>
                    </div>

                    <div class="physical-wheel" id="physicalWheel">
                        <div class="wheel-hub"></div>
                    </div>
                </div>

                <div style="width: 100%; text-align: left; margin-bottom: 5px;">
                    <div class="panel-label">Execution Ledger</div>
                </div>
                <div class="ledger-box" id="ledgerContainer">
                    <div style="text-align: center; color: var(--nk-text-muted); margin-top: 20px; font-weight: bold; font-size: 0.8rem; letter-spacing: 2px;">NO DATA DEPLOYED</div>
                </div>

            </div>

        </div>

    </div>

    <script>
        // ==========================================
        // V100000000 THEME ENGINE
        // ==========================================
        function toggleCentrifugeTheme() {
            let htmlElement = document.documentElement;
            let currentTheme = htmlElement.getAttribute('data-theme');
            let nextTheme;

            if (currentTheme === "light") {
                nextTheme = "dark";
            } else {
                nextTheme = "light";
            }

            htmlElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('lisa_v100000000_wheel_theme', nextTheme);
        }

        // ==========================================
        // GLOBAL KINETIC MEMORY
        // ==========================================
        let activeNodesArray = [];
        let cumulativeRotation = 0;
        let isEngineLocked = false;
        
        // High-contrast tactical color palette for the slices
        let sliceColors = [
            "#ef4444", "#3b82f6", "#10b981", "#f59e0b", 
            "#8b5cf6", "#ec4899", "#06b6d4", "#d946ef",
            "#ea580c", "#14b8a6", "#6366f1", "#f43f5e"
        ];

        document.addEventListener("DOMContentLoaded", function() {
            let savedTheme = localStorage.getItem('lisa_v100000000_wheel_theme');
            if (savedTheme !== null) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
            renderPhysicalWheel();
        });

        // ==========================================
        // CONIC GRADIENT & GEOMETRY ENGINE
        // ZERO ARROW FUNCTIONS. ZERO TERNARIES.
        // ==========================================
        function extractDataNodes() {
            let rawText = document.getElementById('dataInput').value;
            let rawArray = rawText.split('\n');
            let cleanArray = [];

            for (let i = 0; i < rawArray.length; i = i + 1) {
                let trimmed = rawArray[i].trim();
                if (trimmed !== "") {
                    cleanArray.push(trimmed);
                }
            }
            return cleanArray;
        }

        function renderPhysicalWheel() {
            if (isEngineLocked === true) { return; }

            activeNodesArray = extractDataNodes();
            let wheelElement = document.getElementById('physicalWheel');
            
            // Clean old labels (keep the hub)
            let childrenArray = wheelElement.children;
            for (let i = childrenArray.length - 1; i >= 0; i = i - 1) {
                if (childrenArray[i].className !== "wheel-hub") {
                    wheelElement.removeChild(childrenArray[i]);
                }
            }

            if (activeNodesArray.length === 0) {
                wheelElement.style.background = "var(--nk-surface)";
                document.getElementById('systemStatus').innerText = "ERROR: NO DATA NODES DETECTED";
                document.getElementById('systemStatus').style.color = "#ef4444";
                document.getElementById('btnSpin').disabled = true;
                return;
            }

            document.getElementById('systemStatus').innerText = "MATRIX STABLE";
            document.getElementById('systemStatus').style.color = "var(--nk-text-muted)";
            document.getElementById('btnSpin').disabled = false;

            let totalNodes = activeNodesArray.length;
            let degreePerSlice = 360 / totalNodes;
            
            // 1. Build CSS Conic Gradient
            let conicString = "conic-gradient(";
            
            for (let i = 0; i < totalNodes; i = i + 1) {
                let startDegree = i * degreePerSlice;
                let endDegree = (i + 1) * degreePerSlice;
                let colorHex = sliceColors[i % sliceColors.length];
                
                conicString = conicString + colorHex + " " + String(startDegree) + "deg " + String(endDegree) + "deg";
                
                if (i !== totalNodes - 1) {
                    conicString = conicString + ", ";
                }
            }
            conicString = conicString + ")";
            
            wheelElement.style.background = conicString;

            // 2. Inject Geometric Labels
            for (let i = 0; i < totalNodes; i = i + 1) {
                let labelElement = document.createElement("div");
                labelElement.className = "slice-label";
                labelElement.innerText = activeNodesArray[i];

                // Calculate the exact center angle of the slice
                let centerAngle = (i * degreePerSlice) + (degreePerSlice / 2);
                
                // Adjust rotation so text points outward correctly
                let rotationAdjust = centerAngle - 90;

                labelElement.style.transform = "rotate(" + String(rotationAdjust) + "deg) translate(50px, 0px)";
                
                wheelElement.appendChild(labelElement);
            }
        }

        // ==========================================
        // KINETIC CENTRIFUGE ENGINE
        // ==========================================
        function logToLedger(victorString) {
            let container = document.getElementById('ledgerContainer');
            
            // Remove placeholder if present
            if (container.innerText === "NO DATA DEPLOYED") {
                container.innerHTML = "";
            }

            let itemDiv = document.createElement("div");
            itemDiv.className = "ledger-item";
            
            let nameSpan = document.createElement("span");
            nameSpan.innerText = victorString;
            
            let timeSpan = document.createElement("span");
            timeSpan.className = "ledger-timestamp";
            let now = new Date();
            let timeString = String(now.getHours()) + ":" + String(now.getMinutes()) + ":" + String(now.getSeconds());
            timeSpan.innerText = timeString;

            itemDiv.appendChild(nameSpan);
            itemDiv.appendChild(timeSpan);

            // Prepend
            container.insertBefore(itemDiv, container.firstChild);
        }

        function removeNodeFromInputs(targetNode) {
            let rawText = document.getElementById('dataInput').value;
            let rawArray = rawText.split('\n');
            let newText = "";

            let hasBeenRemoved = false;

            for (let i = 0; i < rawArray.length; i = i + 1) {
                let trimmed = rawArray[i].trim();
                
                if (trimmed === targetNode && hasBeenRemoved === false) {
                    // Skip it once
                    hasBeenRemoved = true;
                } else if (trimmed !== "") {
                    if (newText !== "") { newText = newText + "\n"; }
                    newText = newText + trimmed;
                }
            }

            document.getElementById('dataInput').value = newText;
            renderPhysicalWheel(); // Recompile
        }

        function executeCentrifugeSpin() {
            if (isEngineLocked === true || activeNodesArray.length === 0) { return; }
            
            isEngineLocked = true;
            document.getElementById('btnSpin').disabled = true;
            
            let statusElement = document.getElementById('systemStatus');
            statusElement.innerText = "CENTRIFUGE ENGAGED...";
            statusElement.style.color = "var(--nk-accent)";

            let wheelElement = document.getElementById('physicalWheel');
            let totalNodes = activeNodesArray.length;

            // 1. Determine Victor Mathematically Before Spin
            let winningIndex = Math.floor(Math.random() * totalNodes);
            let victorName = activeNodesArray[winningIndex];

            // 2. Calculate Physics Vector
            // The pointer is at Top (0 degrees / 360 degrees)
            let degreePerSlice = 360 / totalNodes;
            
            // Where the winning slice starts and ends
            let sliceStart = winningIndex * degreePerSlice;
            let sliceEnd = (winningIndex + 1) * degreePerSlice;
            
            // Pick a random point INSIDE the winning slice to make it look organic
            let randomOffsetInsideSlice = (Math.random() * (degreePerSlice - 2)) + 1; 
            let targetAngleOnWheel = sliceStart + randomOffsetInsideSlice;

            // Calculate how much we need to rotate the wheel to bring that angle to the Top (which is essentially 360 or 0)
            let rotationNeededToHitTop = 360 - targetAngleOnWheel;

            // Add massive kinetic spins (e.g., 10 full rotations)
            let baseSpins = 10 * 360;
            
            // Final absolute rotation
            let finalRotation = cumulativeRotation + baseSpins + rotationNeededToHitTop;
            
            // Adjust to ensure we don't accidentally spin backwards if modulo math gets weird
            // We strip the remainder of the current rotation so it aligns perfectly
            let currentRemainder = cumulativeRotation % 360;
            finalRotation = finalRotation - currentRemainder;

            // Execute CSS Hardware Acceleration
            wheelElement.style.transform = "rotate(" + String(finalRotation) + "deg)";

            // 3. Await Deceleration & Conclude Protocol
            setTimeout(function() {
                // Lock rotation
                cumulativeRotation = finalRotation;
                
                statusElement.innerText = "NODE ISOLATED: " + victorName;
                statusElement.style.color = "var(--nk-text)";
                
                logToLedger(victorName);

                // Check Deathmatch Protocol
                let isDeathmatch = document.getElementById('eliminationMode').value;
                if (isDeathmatch === "ON") {
                    setTimeout(function() {
                        removeNodeFromInputs(victorName);
                    }, 1000); // 1 second delay so user sees it before it gets purged
                }

                isEngineLocked = false;
                document.getElementById('btnSpin').disabled = false;

            }, 5000); // Exactly matches the 5s cubic-bezier CSS transition
        }

    </script>
</body>
</html>
