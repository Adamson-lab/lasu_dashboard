<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microphone Tester | Tool</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #6f42c1;
            --accent-hover: #59359a;
            --surface: #ffffff;
            --background: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --danger: #dc3545;
            --success: #198754;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            padding: 2rem;
            line-height: 1.5;
        }

        .app-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header { margin-bottom: 2rem; }
        .back-link { color: #2563eb; text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 0.5rem; }
        
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        select {
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--background);
            flex: 1;
            min-width: 250px;
            font-family: inherit;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            background: var(--primary);
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover { background: #334155; }
        .btn-action { background: var(--accent); color: white; }
        .btn-action:hover { background: var(--accent-hover); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #bb2d3b; }

        .visualizer-container {
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            height: 250px;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .standby-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.4);
            font-family: monospace;
            font-size: 1.2rem;
            letter-spacing: 2px;
            pointer-events: none;
        }

        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .telemetry-box {
            background: var(--background);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .telemetry-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .telemetry-value {
            font-size: 1.25rem;
            font-weight: bold;
            font-family: monospace;
            color: var(--primary);
        }

        .error-state {
            color: var(--danger);
            text-align: center;
            padding: 2rem;
            display: none;
            background: #fee2e2;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="app-container">
    <div class="header">
        <a href="{{ url_for('student_portal') }}" class="back-link">← Back To Dashboard</a>
        <h1>Hardware Diagnostics: Microphone</h1>
        <p style="color: var(--text-muted);">Real-time acoustic analysis and frequency visualization.</p>
    </div>

    <div class="card">
        
        <div class="error-state" id="errorState">
            <i class="fas fa-microphone-slash fa-2x mb-2"></i>
            <h3 id="errorMsg">Acoustic hardware access denied.</h3>
            <p>Please allow microphone permissions in your browser to proceed.</p>
        </div>

        <div class="controls">
            <button class="btn btn-action" id="initBtn"><i class="fas fa-power-off"></i> Initialize Acoustic Array</button>
            <button class="btn btn-danger" id="stopBtn" style="display: none;"><i class="fas fa-stop"></i> Terminate Feed</button>
            <select id="micSelect" disabled>
                <option value="">Awaiting hardware permissions...</option>
            </select>
        </div>

        <div class="visualizer-container">
            <div class="standby-text" id="standbyText">SYSTEM STANDBY</div>
            <canvas id="visualizerCanvas"></canvas>
        </div>

        <div class="telemetry-grid">
            <div class="telemetry-box">
                <div class="telemetry-label">Status</div>
                <div class="telemetry-value" id="statusOut" style="color: var(--text-muted);">INACTIVE</div>
            </div>
            <div class="telemetry-box">
                <div class="telemetry-label">Peak Volume</div>
                <div class="telemetry-value" id="volumeOut">0%</div>
            </div>
            <div class="telemetry-box">
                <div class="telemetry-label">Sample Rate</div>
                <div class="telemetry-value" id="sampleRateOut">-- Hz</div>
            </div>
        </div>

    </div>
</div>

<script>
    /**
     * Acoustic Diagnostic Controller
     * Implements Web Audio API for real-time frequency analysis.
     */
    class AudioDiagnostic {
        constructor() {
            this.initBtn = document.getElementById('initBtn');
            this.stopBtn = document.getElementById('stopBtn');
            this.micSelect = document.getElementById('micSelect');
            this.canvas = document.getElementById('visualizerCanvas');
            this.ctx = this.canvas.getContext('2d');
            this.standbyText = document.getElementById('standbyText');
            this.errorState = document.getElementById('errorState');
            
            // Telemetry Outputs
            this.statusOut = document.getElementById('statusOut');
            this.volumeOut = document.getElementById('volumeOut');
            this.sampleRateOut = document.getElementById('sampleRateOut');

            // Audio Context & Nodes
            this.audioCtx = null;
            this.analyser = null;
            this.microphone = null;
            this.stream = null;
            this.animationId = null;

            this.initBindings();
            this.resizeCanvas();
            window.addEventListener('resize', () => this.resizeCanvas());
        }

        initBindings() {
            this.initBtn.addEventListener('click', () => this.startDiagnostic());
            this.stopBtn.addEventListener('click', () => this.stopDiagnostic());
            this.micSelect.addEventListener('change', () => this.switchMicrophone(this.micSelect.value));
        }

        resizeCanvas() {
            this.canvas.width = this.canvas.parentElement.clientWidth;
            this.canvas.height = this.canvas.parentElement.clientHeight;
        }

        async startDiagnostic() {
            try {
                this.errorState.style.display = 'none';
                
                // AudioContext must be resumed/created after user gesture
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                this.handleSuccess(stream);
                await this.enumerateMicrophones();
                
            } catch (err) {
                this.handleError(err);
            }
        }

        async enumerateMicrophones() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioInputs = devices.filter(device => device.kind === 'audioinput');
                
                this.micSelect.innerHTML = '';
                
                if (audioInputs.length === 0) {
                    this.micSelect.innerHTML = '<option>No acoustic devices found</option>';
                    return;
                }

                audioInputs.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Acoustic Device ${index + 1}`;
                    this.micSelect.appendChild(option);
                });

                this.micSelect.disabled = false;
            } catch (err) {
                console.error('Error enumerating devices:', err);
            }
        }

        async switchMicrophone(deviceId) {
            this.stopHardware();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { deviceId: deviceId ? { exact: deviceId } : undefined }
                });
                this.handleSuccess(stream);
            } catch (err) {
                this.handleError(err);
            }
        }

        handleSuccess(stream) {
            this.stream = stream;
            
            // UI Updates
            this.initBtn.style.display = 'none';
            this.stopBtn.style.display = 'inline-flex';
            this.standbyText.style.display = 'none';
            this.statusOut.textContent = 'LISTENING';
            this.statusOut.style.color = 'var(--success)';
            this.sampleRateOut.textContent = `${this.audioCtx.sampleRate} Hz`;

            // Audio Routing Architecture
            this.microphone = this.audioCtx.createMediaStreamSource(stream);
            this.analyser = this.audioCtx.createAnalyser();
            
            this.analyser.fftSize = 256; // Defines number of frequency bins
            this.analyser.smoothingTimeConstant = 0.8;
            
            this.microphone.connect(this.analyser);
            
            this.drawVisualizer();
        }

        handleError(error) {
            console.error('Diagnostic Failure:', error);
            this.errorState.style.display = 'block';
            this.stopDiagnostic();
        }

        stopHardware() {
            if (this.stream) {
                this.stream.getTracks().forEach(track => track.stop());
            }
            if (this.microphone) {
                this.microphone.disconnect();
            }
            if (this.animationId) {
                cancelAnimationFrame(this.animationId);
            }
        }

        stopDiagnostic() {
            this.stopHardware();
            
            if (this.audioCtx && this.audioCtx.state !== 'closed') {
                this.audioCtx.suspend();
            }

            // UI Reset
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            this.initBtn.style.display = 'inline-flex';
            this.stopBtn.style.display = 'none';
            this.standbyText.style.display = 'block';
            this.statusOut.textContent = 'INACTIVE';
            this.statusOut.style.color = 'var(--text-muted)';
            this.volumeOut.textContent = '0%';
            this.sampleRateOut.textContent = '-- Hz';
        }

        drawVisualizer() {
            if (!this.analyser) return;

            this.animationId = requestAnimationFrame(() => this.drawVisualizer());

            const bufferLength = this.analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            this.analyser.getByteFrequencyData(dataArray);

            this.ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

            const barWidth = (this.canvas.width / bufferLength) * 2.5;
            let barHeight;
            let x = 0;
            let sum = 0;

            for (let i = 0; i < bufferLength; i++) {
                barHeight = dataArray[i];
                sum += barHeight;

                // Color gradient from purple (low freq) to cyan (high freq)
                const r = barHeight + (25 * (i/bufferLength));
                const g = 250 * (i/bufferLength);
                const b = 255;

                this.ctx.fillStyle = `rgb(${r},${g},${b})`;
                this.ctx.fillRect(x, this.canvas.height - barHeight / 2, barWidth, barHeight / 2);

                x += barWidth + 1;
            }

            // Calculate overall volume peak for telemetry
            const avgVolume = sum / bufferLength;
            const volumePercent = Math.min(100, Math.round((avgVolume / 128) * 100));
            this.volumeOut.textContent = `${volumePercent}%`;
            
            // Visual clipping warning
            if(volumePercent > 95) {
                this.volumeOut.style.color = 'var(--danger)';
            } else {
                this.volumeOut.style.color = 'var(--primary)';
            }
        }
    }

    document.addEventListener('DOMContentLoaded', () => new AudioDiagnostic());
</script>

</body>
</html>
