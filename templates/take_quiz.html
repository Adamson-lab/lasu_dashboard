<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Take Test | {{ quiz.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5" style="max-width: 800px;">
    <div class="card shadow border-0">
        <div class="card-header bg-primary text-white p-4">
            <h2 class="mb-0">{{ quiz.title }}</h2>
            <p class="mb-0 opacity-75">{{ quiz.course.code }} - {{ quiz.course.title }}</p>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                {% for q in quiz.questions %}
                <div class="mb-4 p-3 border rounded bg-white">
                    <h5 class="fw-bold mb-3">{{ loop.index }}. {{ q.text }}</h5>
                    
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="q_{{ q.id }}" value="A" required>
                        <label class="form-check-label">{{ q.option_a }}</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="q_{{ q.id }}" value="B">
                        <label class="form-check-label">{{ q.option_b }}</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="q_{{ q.id }}" value="C">
                        <label class="form-check-label">{{ q.option_c }}</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="q_{{ q.id }}" value="D">
                        <label class="form-check-label">{{ q.option_d }}</label>
                    </div>
                </div>
                {% endfor %}
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success btn-lg fw-bold" onclick="return confirm('Submit Assessment? You cannot undo this.');">🚀 Submit Assessment</button>
                    <a href="{{ url_for('student_quiz_list') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
