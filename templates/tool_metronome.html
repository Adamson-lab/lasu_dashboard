<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision Metronome | Tool</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #dc3545;
            --accent-hover: #bb2d3b;
            --surface: #ffffff;
            --background: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            padding: 2rem;
            line-height: 1.5;
        }

        .app-container {
            max-width: 600px; /* Kept narrow for focused UI */
            margin: 0 auto;
        }

        .header { margin-bottom: 2rem; text-align: center; }
        .back-link { color: #2563eb; text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 1rem; }
        
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 3rem 2rem;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* The Visual Beat Indicator */
        .beat-indicator {
            width: 20px;
            height: 20px;
            background-color: #e2e8f0;
            border-radius: 50%;
            margin: 0 auto 2rem auto;
            transition: background-color 0.1s, transform 0.1s;
        }

        .beat-indicator.active {
            background-color: var(--accent);
            transform: scale(1.5);
            box-shadow: 0 0 15px var(--accent);
        }
        
        .beat-indicator.accent {
            background-color: #20c997; /* Green for the first beat */
            transform: scale(1.8);
            box-shadow: 0 0 20px #20c997;
        }

        .bpm-display {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            color: var(--primary);
            font-family: monospace;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .bpm-label {
            font-size: 1.2rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 2rem;
        }

        .slider-container {
            margin-bottom: 2rem;
            padding: 0 1rem;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #cbd5e1;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            transition: 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 1rem;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-play { background: var(--primary); color: white; }
        .btn-play:hover { background: #334155; }
        .btn-play.is-playing { background: var(--accent); animation: pulse 2s infinite; }
        
        .btn-tap { background: #e2e8f0; color: var(--text-main); }
        .btn-tap:hover { background: #cbd5e1; }
        .btn-tap:active { transform: scale(0.95); }

        .time-sig-select {
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-weight: bold;
            font-family: inherit;
            color: var(--text-main);
            background: var(--background);
            width: 100%;
            text-align: center;
            cursor: pointer;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
        
        .adjustment-btn {
            background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; transition: 0.2s;
        }
        .adjustment-btn:hover { color: var(--primary); transform: scale(1.2); }

    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    
    

    <link rel="icon" type="image/jpeg" sizes="32x32" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
    <link rel="icon" type="image/jpeg" sizes="16x16" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='lasu_logo.jpg') }}">
</head>
<body>

<div class="app-container">
    <div class="header">
        <a href="{{ url_for('student_portal') }}" class="back-link">← Back To Dashboard</a>
    </div>

    <div class="card">
        <div class="beat-indicator" id="beatIndicator"></div>

        <div class="bpm-display">
            <button class="adjustment-btn" id="btnMinus"><i class="fas fa-minus"></i></button>
            <span id="bpmValue">120</span>
            <button class="adjustment-btn" id="btnPlus"><i class="fas fa-plus"></i></button>
        </div>
        <div class="bpm-label">Beats Per Minute</div>

        <div class="slider-container">
            <input type="range" id="bpmSlider" min="30" max="300" value="120">
        </div>

        <div class="controls-grid">
            <button class="btn btn-play" id="playBtn">
                <i class="fas fa-play" id="playIcon"></i> <span id="playText">START</span>
            </button>
            <button class="btn btn-tap" id="tapBtn">
                <i class="fas fa-hand-pointer"></i> TAP TEMPO
            </button>
        </div>

        <div>
            <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 0.5rem; font-weight: bold; text-transform: uppercase;">Time Signature (Accent)</label>
            <select class="time-sig-select" id="timeSignature">
                <option value="1">1/4 (No Accent)</option>
                <option value="2">2/4</option>
                <option value="3">3/4 (Waltz)</option>
                <option value="4" selected>4/4 (Standard)</option>
                <option value="6">6/8</option>
            </select>
        </div>
    </div>
</div>

<script>
    /**
     * Enterprise Zero-Drift Metronome
     * Uses Web Audio API hardware scheduling instead of JS setInterval.
     */
    class PrecisionMetronome {
        constructor() {
            // DOM Elements
            this.bpmValue = document.getElementById('bpmValue');
            this.bpmSlider = document.getElementById('bpmSlider');
            this.playBtn = document.getElementById('playBtn');
            this.playIcon = document.getElementById('playIcon');
            this.playText = document.getElementById('playText');
            this.tapBtn = document.getElementById('tapBtn');
            this.btnMinus = document.getElementById('btnMinus');
            this.btnPlus = document.getElementById('btnPlus');
            this.beatIndicator = document.getElementById('beatIndicator');
            this.timeSignatureSelect = document.getElementById('timeSignature');

            // Audio & State Architecture
            this.audioCtx = null;
            this.isPlaying = false;
            this.bpm = 120;
            this.beatsPerBar = 4;
            this.currentBeatInBar = 0;
            
            // Scheduling logic
            this.lookahead = 25.0; // How frequently to call scheduling function (in milliseconds)
            this.scheduleAheadTime = 0.1; // How far ahead to schedule audio (sec)
            this.nextNoteTime = 0.0; // when the next note is due
            this.timerID = null;

            // Tap Tempo logic
            this.tapTimes = [];

            this.initBindings();
        }

        initBindings() {
            this.playBtn.addEventListener('click', () => this.togglePlay());
            
            this.bpmSlider.addEventListener('input', (e) => this.setBPM(e.target.value));
            this.btnMinus.addEventListener('click', () => this.setBPM(this.bpm - 1));
            this.btnPlus.addEventListener('click', () => this.setBPM(this.bpm + 1));
            
            this.timeSignatureSelect.addEventListener('change', (e) => {
                this.beatsPerBar = parseInt(e.target.value);
                this.currentBeatInBar = 0; // Reset bar counter on change
            });

            this.tapBtn.addEventListener('mousedown', () => this.handleTap());
            // Touch support for mobile taps
            this.tapBtn.addEventListener('touchstart', (e) => { e.preventDefault(); this.handleTap(); });
        }

        setBPM(newBPM) {
            this.bpm = Math.max(30, Math.min(300, parseInt(newBPM)));
            this.bpmValue.textContent = this.bpm;
            this.bpmSlider.value = this.bpm;
        }

        handleTap() {
            const now = performance.now();
            
            // If it's been more than 2 seconds since last tap, reset the array
            if (this.tapTimes.length > 0 && now - this.tapTimes[this.tapTimes.length - 1] > 2000) {
                this.tapTimes = [];
            }
            
            this.tapTimes.push(now);

            if (this.tapTimes.length >= 2) {
                // Keep only the last 4 taps for moving average
                if (this.tapTimes.length > 4) this.tapTimes.shift();

                let intervals = [];
                for (let i = 1; i < this.tapTimes.length; i++) {
                    intervals.push(this.tapTimes[i] - this.tapTimes[i - 1]);
                }

                const averageInterval = intervals.reduce((a, b) => a + b) / intervals.length;
                const calculatedBPM = Math.round(60000 / averageInterval);
                
                this.setBPM(calculatedBPM);
            }
        }

        nextNote() {
            // Advance current note and time by a 16th note...
            const secondsPerBeat = 60.0 / this.bpm;
            this.nextNoteTime += secondsPerBeat;
            
            this.currentBeatInBar++;
            if (this.currentBeatInBar === this.beatsPerBar) {
                this.currentBeatInBar = 0;
            }
        }

        scheduleNote(beatNumber, time) {
            // Push the note to the Web Audio Hardware queue
            const osc = this.audioCtx.createOscillator();
            const envelope = this.audioCtx.createGain();

            osc.connect(envelope);
            envelope.connect(this.audioCtx.destination);

            // Logic for accented beats (the "Tick" vs the "Tock")
            const isAccent = (beatNumber === 0 && this.beatsPerBar > 1);
            
            if (isAccent) {
                osc.frequency.value = 1200.0; // Higher pitch for accent
            } else {
                osc.frequency.value = 800.0; // Standard pitch
            }

            envelope.gain.value = 1;
            envelope.gain.exponentialRampToValueAtTime(1, time + 0.001);
            envelope.gain.exponentialRampToValueAtTime(0.001, time + 0.05); // Sharp decay for a "click"

            osc.start(time);
            osc.stop(time + 0.05);

            // Schedule the visual flash to sync perfectly with the audio context time
            // We use setTimeout here strictly for UI, knowing the audio is hardware-locked
            const timeUntilVisual = (time - this.audioCtx.currentTime) * 1000;
            
            setTimeout(() => {
                this.beatIndicator.className = 'beat-indicator'; // Reset
                // Force reflow
                void this.beatIndicator.offsetWidth; 
                this.beatIndicator.classList.add('active');
                if (isAccent) this.beatIndicator.classList.add('accent');
            }, Math.max(0, timeUntilVisual));
        }

        scheduler() {
            // While there are notes that will need to play before the next interval,
            // schedule them and advance the pointer.
            while (this.nextNoteTime < this.audioCtx.currentTime + this.scheduleAheadTime) {
                this.scheduleNote(this.currentBeatInBar, this.nextNoteTime);
                this.nextNote();
            }
            this.timerID = setTimeout(() => this.scheduler(), this.lookahead);
        }

        togglePlay() {
            if (!this.audioCtx) {
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (this.isPlaying) {
                // Stop
                clearTimeout(this.timerID);
                this.isPlaying = false;
                this.playBtn.classList.remove('is-playing');
                this.playIcon.className = 'fas fa-play';
                this.playText.textContent = 'START';
                this.beatIndicator.className = 'beat-indicator';
            } else {
                // Play
                if (this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
                this.isPlaying = true;
                this.currentBeatInBar = 0;
                this.nextNoteTime = this.audioCtx.currentTime + 0.05;
                this.scheduler();
                
                this.playBtn.classList.add('is-playing');
                this.playIcon.className = 'fas fa-stop';
                this.playText.textContent = 'STOP';
            }
        }
    }

    document.addEventListener('DOMContentLoaded', () => new PrecisionMetronome());
</script>

</body>
</html>
